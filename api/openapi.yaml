  /api/v1/projects/{project}/jobs/{id}/download.zip:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to explicitly attached jobs/artifacts. Unattached IDs and scope-overriding
        query parameters are refused. Streams ready artifacts as an owner-protected ZIP without recompression or a
        retained archive. Defaults to this job's ready files in item order. Optional artifact_id values include earlier
        partial-retry successes from the same owner and source, in requested order. All files are checked and opened
        before streaming; expired or foreign files return an error. Ordered numeric filename prefixes handle duplicate
        names. An interrupted ZIP must be downloaded again; byte ranges are not supported. This scoped route uses
        the anchor job’s artifacts only; explicit artifact_id overrides are rejected.
      responses:
        '200':
          description: ZIP of ready files
