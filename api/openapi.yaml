  /api/v1/sources/{id}/analysis/video:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      description: Owner-only analysis of staged local source media. No cached files or export artifacts. JSON options
        body maximum 8 KiB; selected interval at most 30 minutes, deadline at most 2 minutes. Six analyses/minute share
        one owner admission budget. Results report actual decoded coverage; do not infer analysis of an uncovered
        tail. Platform provider URLs are not fetched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoAnalysisOptions'
      responses:
        '200':
          description: Bounded source-timeline analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoAnalysisResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sources/{id}/analysis/loudness:
    parameters:
    - $ref: '#/components/parameters/ID'
    post:
      description: Owner-only analysis of staged local source media. No cached files or export artifacts. JSON options
        body maximum 8 KiB; selected interval at most 30 minutes, deadline at most 2 minutes. Six analyses/minute share
        one owner admission budget. Results report actual decoded coverage; do not infer analysis of an uncovered
        tail. Platform provider URLs are not fetched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoudnessOptions'
      responses:
        '200':
          description: Bounded source-timeline analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoudnessResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/cut-lists/import:
    post:
      description: Pure bounded CSV/FFmetadata conversion without opening media, local paths or source references.
        Shared owner budget 60/minute. CSV retains edit order and unresolved markers; FFmetadata requires resolved
        ordered non-overlapping intervals. Segment export uses actual output timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutListImportRequest'
      responses:
        '200':
          description: Converted cut decisions or UTF-8 text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/cut-lists/export:
    post:
      description: Pure bounded CSV/FFmetadata conversion without opening media, local paths or source references.
        Shared owner budget 60/minute. CSV retains edit order and unresolved markers; FFmetadata requires resolved
        ordered non-overlapping intervals. Segment export uses actual output timestamps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CutListExportRequest'
      responses:
        '200':
          description: Converted cut decisions or UTF-8 text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CutListText'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/subtitles/retime:
    post:
      description: >-
        Pure bounded transformation of supplied UTF-8 SRT/WebVTT against actual
        source/output segment maps. No source access, media tools, transcription,
        rendering or file publication. Request JSON is bounded to 4 MiB; supplied
        text to 512 KiB and 10000 cues; total segments to 4096. Output text across
        all clips is bounded to 8 MiB/100000 cues and one million candidate
        intersections. Half-open source intervals may repeat or reorder; output
        intervals must be ordered and non-overlapping. Timed/style features
        outside the documented caption subset are explicitly refused.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubtitleRetimeRequest'
      responses:
        '200':
          description: Per-clip UTF-8 text with exact SHA256, including empty sidecars
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleRetimeResult'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/artifacts/{id}/poster:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      description: Create one inspected JPEG/PNG from a terminal owned verified output. Timestamp uses the finished output clock. Project/handoff access does not grant this owner-only mutation. Synchronous bounded30-second operation; identical parent/timestamp/format returns the existing image.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PosterRequest'}
      responses:
        '201':
          description: Image artifact created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageArtifact'}
        '200':
          description: Existing identical image artifact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageArtifact'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/image-artifacts/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      description: Read an owned retained image artifact; absent, foreign or expired IDs return404.
      responses:
        '200':
          description: Image artifact
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImageArtifact'}
        default: {$ref: '#/components/responses/Error'}
    delete:
      description: Delete this owned derivative only; active readers/preparation prevent deletion. Parent video remains available.
      responses:
        '204': {description: Image artifact removed}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/image-artifacts/{id}/download:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      description: Owner-protected inspected image bytes. Never follows a client-supplied URL. Ordinary private conditional and Range semantics apply.
      responses:
        '200':
          description: Complete image
          content:
            image/jpeg:
              schema: {type: string, format: binary}
            image/png:
              schema: {type: string, format: binary}
        '206': {description: Requested image byte range}
        '304': {description: Authorized image unchanged}
        '412': {description: Request precondition failed}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cutmy_session
  headers:
    PreviewCache:
      x-required: true
      schema: {type: string, enum: [hit, miss]}
    PreviewStart:
      x-required: true
      schema: {type: integer}
    PreviewEnd:
      x-required: true
      schema: {type: integer}
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: {type: string}
  responses:
    RangeError:
      description: Malformed or unsatisfiable Range. Plain text comes from HTTP byte-range serving; clients must not parse it as the JSON error envelope.
      headers:
        Content-Range:
          description: Included for unsatisfiable ranges as bytes */size; malformed ranges may omit it.
          schema: {type: string, pattern: '^bytes \*/[0-9]+$'}
      content:
        text/plain:
          schema: {type: string}
    DatabaseUnavailable:
      description: A bounded database operation failed or exceeded its budget. Mutations may already have committed; the same uncertainty can accompany an earlier 408 request_timeout or 504 source_timeout. Recover retained job submissions with the same Idempotency-Key. For keyed uploads/imports, reconcile GET source-preparations/{key} and replay the saved immutable intent/key. Unkeyed legacy uploads/imports have no idempotency guarantee; check their same-session source list before repeating. No blanket retry guarantee is given for other mutations.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - type: object
                properties:
                  error:
                    properties:
                      code: {const: database_unavailable}
    StorageUnavailable:
      description: A bounded database failure or incomplete initial storage accounting. storage_initializing rejects admission before media preparation; Retry-After gives seconds before another attempt. database_unavailable retains its uncertain-mutation guidance.
      headers:
        Retry-After:
          description: Present for storage_initializing; seconds before retrying the rejected admission.
          schema: {type: string, pattern: '^[0-9]+$'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - type: object
                properties:
                  error:
                    properties:
                      code: {enum: [database_unavailable, storage_initializing]}
    Error:
      description: Structured error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Source:
      description: Prepared source
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Source'}
    Job:
      description: Export job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Source:
      type: object
      required: [id, title, duration_ms, kind, provider, provider_video_id, source_url, preview_kind, preview_url, embed_url, thumbnail_url, expires_at, retention_blocked]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: 'RFC3339 source retention target, or null while linked jobs pin the source.'}
        retention_blocked: {type: boolean, description: A retained job currently pins this source.}
        fingerprint: {$ref: '#/components/schemas/SourceFingerprint'}
        media_removed: {type: boolean, default: false, description: Original media was removed after successful export. Metadata and results remain retained; reopen the recording to continue editing.}
        title: {type: string}
        duration_ms: {type: integer, minimum: 1}
        kind: {type: string, enum: [upload, direct, youtube, platform]}
        provider:
          type: string
          enum: [upload, direct, generic, youtube, twitch, rutube, tiktok, instagram, vimeo, dailymotion, vk, facebook, x, reddit, ok, bilibili, streamable, rumble]
          description: Recognized extractor family; a provider name is not a guarantee of link availability.
        provider_video_id: {type: [string, 'null']}
        source_url:
          type: [string, 'null']
          description: HTTPS platform page URL; null for uploads and direct files. Never an extracted CDN media address.
        preview_kind: {type: string, enum: [native, youtube, window, none]}
        preview_url: {type: [string, 'null']}
        embed_url: {type: [string, 'null']}
        thumbnail_url:
          type: [string, 'null']
          description: Relative owner-protected thumbnail endpoint, or null. Never a raw external image URL.
        width:
          type: integer
          description: Coded width of the selected playable video for local files; omitted for audio-only files. Platform sources use provider format metadata. Persisted source responses do not expose fresh SDK/CLI display dimensions.
        height:
          type: integer
          description: Coded height of the selected playable video for local files, before sample-aspect-ratio/display-rotation normalization; omitted for audio-only files.
        tracks:
          type: array
          items: {$ref: '#/components/schemas/Track'}
          description: Optional fresh stream inspection; use the tracks endpoint for retained sources.
    Track:
      type: object
      required: [index, type, codec, default]
      properties:
        index: {type: integer, minimum: 0}
        type: {type: string}
        codec: {type: string}
        language: {type: string}
        title: {type: string}
        channels: {type: integer}
        sample_rate: {type: string}
        attached_picture: {type: boolean}
        default: {type: boolean}
    TrackSelection:
      type: object
      required: [index, type, codec, default, included, reason]
      properties:
        index: {type: integer, minimum: 0}
        type: {type: string}
        codec: {type: string}
        language: {type: string}
        title: {type: string}
        channels: {type: integer}
        sample_rate: {type: string}
        attached_picture: {type: boolean}
        default: {type: boolean}
        included: {type: boolean}
        reason: {type: string, description: Explanation of the stream selection; unknown future values are permitted.}
    ArtifactSegment:
      type: object
      required: [index, label, source_start_ms, source_end_ms, output_start_ms, output_end_ms]
      properties:
        index: {type: integer}
        label: {type: string}
        source_start_ms: {type: integer}
        source_end_ms: {type: integer}
        output_start_ms: {type: integer}
        output_end_ms: {type: integer}
    Range:
      type: object
      additionalProperties: false
      required: [start_ms, end_ms]
      properties:
        start_ms: {type: integer, minimum: 0}
        end_ms: {type: integer, minimum: 1}
        label: {type: string, x-maxBytes: 200, x-trimSpace: true, description: Optional label; maximum 200 UTF-8 bytes after trimming Unicode whitespace}
    Waveform:
      type: object
      required: [start_ms, end_ms, step_ms, has_audio, peaks]
      properties:
        start_ms: {type: integer, minimum: 0, description: Aligned source timeline start}
        end_ms: {type: integer, minimum: 1, description: Source end or start plus 30000 ms}
        step_ms: {type: integer, const: 100}
        has_audio: {type: boolean}
        audio_track: {type: integer, minimum: 0}
        peaks:
          type: array
          maxItems: 300
          items: {type: number, minimum: 0, maximum: 1}
    Crop:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: Normalized rectangle in the upright square-pixel displayed image. Requires accurate MP4. Both opposite edges must remain inside the image; dimensions must resolve to at least two displayed pixels. Each edge rounds to the nearest even pixel boundary within the image by at most one displayed pixel, before the normal resolution cap.
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        height: {type: number, exclusiveMinimum: 0, maximum: 1}
    Speed:
      type: object
      additionalProperties: false
      required: [numerator, denominator]
      description: Constant rational playback speed0.5..2; both terms1..1000. Runtime reduces the fraction and omits unity. Accurate MP4/MP3 only; pitch is preserved and maps retain source/output endpoints.
      properties:
        numerator: {type: integer, minimum: 1, maximum: 1000}
        denominator: {type: integer, minimum: 1, maximum: 1000}
    PosterRequest:
      type: object
      additionalProperties: false
      required: [timestamp_ms]
      properties:
        timestamp_ms: {type: integer, minimum: 0, description: Strictly before the measured finished video duration.}
        format: {type: string, enum: [jpeg, png], default: jpeg}
    ImageArtifact:
      type: object
      required: [id, parent_artifact_id, filename, size_bytes, download_url, width, height, timestamp_ms, expires_at, format]
      properties:
        id: {type: string}
        parent_artifact_id: {type: string}
        filename: {type: string}
        size_bytes: {type: integer, minimum: 1, maximum: 16777216}
        download_url: {type: string, description: Same-origin owner-protected image-artifact download route.}
        width: {type: integer, minimum: 1}
        height: {type: integer, minimum: 1}
        timestamp_ms: {type: integer, minimum: 0}
        expires_at: {type: [string, 'null'], format: date-time}
        format: {type: string, enum: [jpeg, png]}
    AudioNormalize:
      type: object
      additionalProperties: false
      required:
      - integrated_lufs
      - true_peak_dbtp
      - loudness_range_lu
      properties:
        integrated_lufs:
          type: number
          minimum: -70
          maximum: -5
        true_peak_dbtp:
          type: number
          minimum: -9
          maximum: 0
        loudness_range_lu:
          type: number
          minimum: 1
          maximum: 50
      description: Explicit EBU R128 targets for each completed output timeline. Requires accurate MP4/MP3 and an audio
        stream; does not mix or amplify by an arbitrary percentage.
    Canvas:
      type: object
      additionalProperties: false
      required:
      - width
      - height
      - fit
      - background
      properties:
        width:
          type: integer
          minimum: 2
          maximum: 4096
          multipleOf: 2
        height:
          type: integer
          minimum: 2
          maximum: 4096
          multipleOf: 2
        fit:
          type: string
          const: contain
        background:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
      description: Solid fit/pad of the cropped displayed picture without stretching. Requires accurate final MP4 and
        quality best; dimensions are final encoded pixels.
    AudioReplace:
      type: object
      additionalProperties: false
      required:
      - source_id
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 160
          description: Uploaded staged local audio source owned by the same session. A project grant covers its primary
            source only and cannot authorize a new replacement reference. HTTP never accepts input paths.
        audio_track:
          type: integer
          minimum: 0
        offset_ms:
          type: integer
          minimum: -86400000
          maximum: 86400000
          default: 0
          description: Positive places replacement timestamp zero at this original source time; uncovered audio is silence
            and never shortens video.
    AnalysisInterval:
      type: object
      additionalProperties: false
      required:
      - start_ms
      - end_ms
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
    SilenceOptions:
      type: object
      additionalProperties: false
      properties:
        start_ms:
          type: integer
          minimum: 0
          default: 0
        end_ms:
          type: integer
          minimum: 0
          default: 0
          description: Zero uses source duration; selected analysis interval is at most 30 minutes.
        audio_track:
          type: integer
          minimum: 0
        threshold_db:
          description: Omitted or zero uses -35 dBFS.
          anyOf:
          - type: number
            minimum: -90
            maximum: -1
          - const: 0
        min_silence_ms:
          description: Omitted or zero uses 500 ms.
          anyOf:
          - type: integer
            minimum: 10
            maximum: 60000
          - const: 0
        keep_before_ms:
          type: integer
          minimum: 0
          maximum: 5000
        keep_after_ms:
          type: integer
          minimum: 0
          maximum: 5000
        min_clip_ms:
          type: integer
          minimum: 0
          maximum: 60000
    VideoAnalysisOptions:
      type: object
      additionalProperties: false
      properties:
        start_ms:
          type: integer
          minimum: 0
          default: 0
        end_ms:
          type: integer
          minimum: 0
          default: 0
        scene_threshold:
          description: Omitted or zero uses 0.3.
          anyOf:
          - type: number
            minimum: 0.001
            maximum: 1
          - const: 0
        black_pixel_threshold:
          description: Omitted or zero uses 0.1.
          type: number
          minimum: 0
          maximum: 1
        black_picture_ratio:
          description: Omitted or zero uses 0.98.
          anyOf:
          - type: number
            exclusiveMinimum: 0
            maximum: 1
          - const: 0
        min_black_ms:
          description: Omitted or zero uses 500 ms.
          anyOf:
          - type: integer
            minimum: 1
            maximum: 60000
          - const: 0
    LoudnessOptions:
      type: object
      additionalProperties: false
      properties:
        start_ms:
          type: integer
          minimum: 0
          default: 0
        end_ms:
          type: integer
          minimum: 0
          default: 0
        audio_track:
          type: integer
          minimum: 0
    CutListEntry:
      type: object
      additionalProperties: false
      required:
      - start_ms
      - end_ms
      - label
      properties:
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type:
          - integer
          - 'null'
          minimum: 1
          description: Null is an unresolved chapter marker, preserved during text import. Building an edit plan requires
            explicit duration to resolve the final marker.
        label:
          type: string
          x-maxBytes: 200
    CutList:
      type: object
      additionalProperties: false
      required:
      - version
      - entries
      properties:
        version:
          type: integer
          const: 1
        entries:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/CutListEntry'
    CutListImportRequest:
      type: object
      additionalProperties: false
      required:
      - format
      - text
      properties:
        format:
          type: string
          enum:
          - csv
          - ffmetadata
        text:
          type: string
          x-maxBytes: 1048576
    CutListExportRequest:
      type: object
      additionalProperties: false
      required:
      - format
      properties:
        format:
          type: string
          enum:
          - csv
          - ffmetadata
        cut_list:
          $ref: '#/components/schemas/CutList'
        segments:
          type: array
          minItems: 1
          maxItems: 128
          items:
            $ref: '#/components/schemas/ArtifactSegment'
      oneOf:
      - required:
        - cut_list
      - required:
        - segments
    CutListText:
      type: object
      additionalProperties: false
      required:
      - version
      - format
      - text
      properties:
        version:
          type: integer
          const: 1
        format:
          type: string
          enum:
          - csv
          - ffmetadata
        text:
          type: string
    SilenceResult:
      type: object
      required:
      - version
      - start_ms
      - end_ms
      - analyzed_end_ms
      - audio_track
      - silence
      - keep
      properties:
        version:
          type: integer
          const: 1
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
        analyzed_end_ms:
          type: integer
          minimum: 0
          description: Actual decoded source-clock coverage, no later than requested end. Uncovered tails are not classified
            as silence.
        audio_track:
          type: integer
          minimum: 0
        silence:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: '#/components/schemas/AnalysisInterval'
        keep:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: '#/components/schemas/Range'
    VideoAnalysisResult:
      type: object
      required:
      - version
      - start_ms
      - end_ms
      - analyzed_end_ms
      - video_track
      - scenes
      - black
      properties:
        version:
          type: integer
          const: 1
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
        analyzed_end_ms:
          type: integer
          minimum: 0
          description: Actual decoded source-clock coverage, no later than requested end. Uncovered tails are not classified
            as silence.
        video_track:
          type: integer
          minimum: 0
        scenes:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            type: object
            additionalProperties: false
            required:
            - at_ms
            - score
            properties:
              at_ms:
                type: integer
                minimum: 0
              score:
                type: number
                minimum: 0
                maximum: 1
        black:
          type: array
          minItems: 0
          maxItems: 4096
          items:
            $ref: '#/components/schemas/AnalysisInterval'
    LoudnessResult:
      type: object
      required:
      - version
      - start_ms
      - end_ms
      - analyzed_end_ms
      - audio_track
      - integrated_lufs
      - true_peak_dbtp
      - loudness_range_lu
      properties:
        version:
          type: integer
          const: 1
        start_ms:
          type: integer
          minimum: 0
        end_ms:
          type: integer
          minimum: 1
        analyzed_end_ms:
          type: integer
          minimum: 0
          description: Actual decoded source-clock coverage, no later than requested end. Uncovered tails are not classified
            as silence.
        audio_track:
          type: integer
          minimum: 0
        integrated_lufs:
          type:
          - number
          - 'null'
        true_peak_dbtp:
          type:
          - number
          - 'null'
        loudness_range_lu:
          type:
          - number
          - 'null'
    ExportRequest:
      type: object
      additionalProperties: false
      required: [source_id, ranges, format, quality, cut_mode]
      properties:
        source_id: {type: string}
        cleanup_source: {type: boolean, default: false, description: Remove original media and preview assets after full success and accepted operations settle. Projects and finished artifacts remain available. Omission preserves legacy retention. Concurrent failure or cancellation preserves the source.}
        ranges:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Range'}
        format: {type: string, enum: [mp4, mp3, mkv, wav, flac, m4a], description: MKV and AAC-only M4A require copy; MP3/WAV/FLAC require accurate. WAV PCM24 and FLAC24 preserve inspected sample rate and channels1..8.}
        quality: {type: string, enum: [1080p, 720p, best]}
        cut_mode: {type: string, enum: [accurate, copy], description: MP3 requires accurate. Copy preserves source resolution; select best for original quality. A lower explicit cap fails with copy_quality_unsupported instead of silently resizing or exceeding the cap.}
        output_mode: {type: string, enum: [separate, joined], default: separate, description: Separate publishes each range independently. Joined publishes one artifact in submitted range order; its actual bounds describe the output timeline and segments describe each source interval.}
        audio_track: {type: integer, minimum: 0, description: Absolute inspected audio stream index for staged local media. Omission uses first default audio, otherwise first audio.}
        no_audio: {type: boolean, default: false, description: Export video without audio; cannot be combined with audio_track or MP3.}
        subtitle_mode: {type: string, enum: [omit, preserve], default: omit, description: Preserve compatible plain text subtitles from local copy sources, clipped and rebased to actual boundaries. Unsupported subtitle codecs fail explicitly. MP4 writes mov_text; MKV writes subrip.}
        crop: {$ref: '#/components/schemas/Crop'}
        audio_normalize: {$ref: '#/components/schemas/AudioNormalize'}
        canvas: {$ref: '#/components/schemas/Canvas'}
        audio_replace: {$ref: '#/components/schemas/AudioReplace'}
        speed: {$ref: '#/components/schemas/Speed'}
        target_size_bytes: {type: integer, minimum: 0, description: 'Zero/omitted disables the requested ceiling. Positive values require final accurate H.264 MP4 and cannot exceed operator output limits. Applies per published media file, including audio/container overhead; impossible targets fail without implicit quality/resolution changes.'}
        rendition: {type: string, enum: [final, draft], default: final, description: Draft requires accurate MP4 and uses a 720p cap plus ultrafast CRF28 encoding. Omitted/final retains installed final encoder settings. Persisted normalized final requests omit this field.}
    CollectionRequest:
      type: object
      additionalProperties: false
      required: [source_id, plan]
      properties:
        source_id: {type: string, description: Source accessible to the current session. HTTP collection plans cannot open local filesystem paths.}
        plan: {$ref: '#/components/schemas/CollectionPlan'}
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
          description: Selected IDs, returned in plan order. Empty/omitted selects every clip. Unknown or duplicate IDs fail explicitly.
        rendition: {type: string, enum: [final, draft], default: final, description: Draft requires accurate MP4, retains edits/crop/audio choices and uses a 720p cap plus ultrafast CRF28 encoding. Final uses requested quality and installed final encoder settings.}
    CollectionPlan:
      type: object
      additionalProperties: false
      required: [version, clips]
      properties:
        version: {type: integer, const: 1}
        input: {type: string, const: '', description: Local engine plans may contain input; HTTP requires this field to be absent or empty and uses source_id.}
        options: {$ref: '#/components/schemas/CollectionOptions'}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/CollectionClip'}
    CollectionClip:
      type: object
      additionalProperties: false
      required: [id, ranges]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: Stable unique clip identity within this plan.}
        label: {type: string, x-maxBytes: 200, description: Optional human label; whitespace is trimmed for normalized output.}
        ranges:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/Range'}
          description: Source intervals joined in this order, including repeated or overlapping intervals. Selected intervals share aggregate server budgets.
        options: {$ref: '#/components/schemas/CollectionOptions'}
    CollectionOptions:
      type: object
      additionalProperties: false
      description: Clip options override collection options. Empty strings and omitted/null pointers inherit. Defaults are MP4, best, accurate, automatic audio and omitted subtitles. Explicit no_audio false enables inherited audio; audio_track -1 resets inherited selection to automatic. clear_crop removes inherited crop; crop and clear_crop together fail. Settings must be compatible after inheritance.
      properties:
        format: {type: string, enum: ['', mp4, mp3, mkv, wav, flac, m4a]}
        quality: {type: string, enum: ['', best, 1080p, 720p]}
        cut_mode: {type: string, enum: ['', accurate, copy]}
        subtitle_mode: {type: string, enum: ['', omit, preserve]}
        audio_track: {type: [integer, 'null'], minimum: -1}
        no_audio: {type: [boolean, 'null']}
        crop:
          oneOf:
            - {$ref: '#/components/schemas/Crop'}
            - {type: 'null'}
        clear_crop: {type: boolean}
        audio_normalize:
          oneOf:
            - {$ref: '#/components/schemas/AudioNormalize'}
            - {type: 'null'}
        clear_audio_normalize: {type: boolean}
        canvas:
          oneOf:
            - {$ref: '#/components/schemas/Canvas'}
            - {type: 'null'}
        clear_canvas: {type: boolean}
        audio_replace:
          oneOf:
            - {$ref: '#/components/schemas/AudioReplace'}
            - {type: 'null'}
        clear_audio_replace: {type: boolean}
        speed:
          oneOf:
            - {$ref: '#/components/schemas/Speed'}
            - {type: 'null'}
        clear_speed: {type: boolean, description: Remove inherited speed; cannot accompany a non-null speed.}
        target_size_bytes: {type: integer, minimum: 0, description: Positive values override inherited target; zero/omitted inherits.}
        clear_target_size: {type: boolean, description: Remove inherited byte target; cannot accompany a positive target.}
    CollectionDiagnostic:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: Open public diagnostic vocabulary; accept future codes.}
        message: {type: string, description: Safe human diagnostic without server paths or raw subprocess/database output.}
        clip_id: {type: string, description: Clip responsible for this error, when identifiable. A shared inspection blocker can prevent admission of other pending clips.}
        field: {type: string, description: JSON-style field path within the clip or top-level plan/selection.}
    CollectionError:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/CollectionDiagnostic'}
    CollectionValidation:
      type: object
      required: [version, valid, rendition, requested_duration_ms, clips]
      properties:
        version: {type: integer, const: 1}
        valid: {type: boolean, const: true}
        rendition: {type: string, enum: [final, draft]}
        requested_duration_ms: {type: integer, minimum: 1}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [clip_id, label, preflight]
            properties:
              clip_id: {type: string}
              label: {type: string}
              preflight: {$ref: '#/components/schemas/PreflightResult'}
    CollectionSubmission:
      type: object
      required: [version, rendition, complete, clips]
      properties:
        version: {type: integer, const: 1}
        rendition: {type: string, enum: [final, draft]}
        complete: {type: boolean, description: All selected clips have retained/admitted jobs. Jobs can still be running, failed or cancelled.}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [clip_id, label, requested_duration_ms, request, retryable]
            oneOf:
              - required: [job]
              - required: [error]
            properties:
              clip_id: {type: string}
              label: {type: string}
              requested_duration_ms: {type: integer, minimum: 1}
              request: {$ref: '#/components/schemas/ExportRequest'}
              job: {$ref: '#/components/schemas/Job'}
              error: {$ref: '#/components/schemas/CollectionDiagnostic'}
              retryable: {type: boolean, description: Pending work can be retried with the same plan/workflow key after the stated condition changes. Recovered jobs use false.}
    PreflightResult:
      type: object
      required: [version, valid, source, request, requested_duration_ms, output_count, track_manifest, checks, warnings]
      description: A read-only prerequisite report. Known blockers return an error response instead. Deferred checks are not proof of export success; execution does its own validation and admission. No local server paths, extracted media URLs or tool diagnostics are exposed.
      properties:
        version: {type: integer, const: 1}
        valid: {type: boolean, const: true}
        source: {$ref: '#/components/schemas/PreflightSource'}
        request: {$ref: '#/components/schemas/ExportRequest'}
        requested_duration_ms: {type: integer, minimum: 1, description: Sum of requested intervals in submitted order; overlapping or repeated intervals each contribute. Copy boundaries can change actual duration.}
        output_count: {type: integer, minimum: 1, description: One for joined export; otherwise one per requested interval.}
        track_manifest:
          type: array
          items: {$ref: '#/components/schemas/TrackSelection'}
          description: Deterministic inspected stream selection for local media; empty for remote metadata-only checks.
        video: {$ref: '#/components/schemas/PreflightVideo'}
        checks:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PreflightCheck'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/PreflightWarning'}
    PreflightSource:
      type: object
      required: [duration_ms]
      properties:
        duration_ms: {type: integer, minimum: 1}
        width: {type: integer, minimum: 1, description: Coded selected video width, omitted for audio-only sources.}
        height: {type: integer, minimum: 1, description: Coded selected video height, omitted for audio-only sources.}
        display_width: {type: integer, minimum: 1, description: Fresh local upright square-pixel display width when supported; omitted for remote or audio-only sources.}
        display_height: {type: integer, minimum: 1, description: Fresh local upright square-pixel display height when supported; omitted for remote or audio-only sources.}
    PreflightVideo:
      type: object
      required: [width, height, hdr_to_sdr]
      properties:
        width: {type: integer, minimum: 1, description: Requested rendered video width; copy retains source dimensions.}
        height: {type: integer, minimum: 1, description: Requested rendered video height; copy retains source dimensions.}
        hdr_to_sdr: {type: boolean, description: Accurate rendering requests HDR-to-SDR conversion.}
    PreflightCheck:
      type: object
      required: [name, status]
      properties:
        name: {type: string, description: Prerequisite identifier; clients must accept future names.}
        status: {type: string, enum: [passed, deferred]}
    PreflightWarning:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: Machine-readable warning; clients must accept future codes.}
        message: {type: string, description: Human diagnostic which may change.}
    Artifact:
      type: object
      required: [id, filename, size_bytes, download_url, actual_start_ms, actual_end_ms, expires_at]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: 'Immutable result retention deadline, or null while an active job pins the result.'}
        filename: {type: string}
        size_bytes: {type: integer}
        download_url: {type: string}
        actual_start_ms: {type: integer}
        actual_end_ms: {type: integer}
        segments:
          type: array
          items: {$ref: '#/components/schemas/ArtifactSegment'}
        track_manifest:
          type: array
          items: {$ref: '#/components/schemas/TrackSelection'}
    JobItem:
      type: object
      required: [id, label, start_ms, end_ms, status, artifact]
      properties:
        id: {type: string}
        label: {type: string}
        start_ms: {type: integer}
        end_ms: {type: integer}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress_ms:
          type: integer
          minimum: 0
          description: Optional processed media time from FFmpeg, in milliseconds. Omitted before progress is available and in legacy jobs. Encoding can finish before file validation/publication; only succeeded status makes an artifact ready. A cached-address refresh may reset progress.
        message: {type: string}
        error_code:
          type: string
          description: Optional fixed public diagnostic on failed/cancelled items. Legacy items can omit it. Localize known codes and use a safe generic fallback for unknown ones; never display raw subprocess output.
          examples: [audio_missing, hdr_conversion_unavailable, output_limit, platform_access_required, platform_unavailable, unsupported_stream, live_not_supported, unsupported_collection, media_upstream_denied, media_upstream_unavailable, media_network_timeout, media_network_reset, copy_incompatible, copy_quality_unsupported, media_processing_failed, source_expired, source_changed, source_timeline_changed, source_timeout, job_timeout, storage_full, storage_timeout, storage_limit, server_error, cancelled]
        artifact:
          oneOf:
            - {$ref: '#/components/schemas/Artifact'}
            - {type: 'null'}
    JobSummary:
      type: object
      required: [id, source_id, title, status, stage, created_at, total, files]
      properties:
        id: {type: string}
        source_id: {type: string}
        title: {type: string}
        status: {type: string, enum: [queued, running, waiting_storage, succeeded, failed, cancelled]}
        stage: {type: string}
        created_at: {type: string, format: date-time}
        total: {type: integer}
        files:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
    Job:
      type: object
      required: [id, status, stage, message, items, storage_wait_until]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, waiting_storage, succeeded, failed, cancelled]}
        storage_wait_until: {type: [string, 'null'], format: date-time, description: Finite persisted storage wait deadline; null before the first storage wait.}
        stage: {type: string}
        message: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/JobItem'}

    SourceFingerprint:
      description: Typed identity. content is verified complete uploaded/downloaded bytes; provider is metadata identity
        and is never a claim about media bytes.
      oneOf:
      - type: object
        required:
        - kind
        - sha256
        - size_bytes
        properties:
          kind:
            const: content
          sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
          size_bytes:
            type: integer
            minimum: 1
      - type: object
        required:
        - kind
        - canonical_url_sha256
        properties:
          kind:
            const: provider
          provider:
            type: string
          provider_id:
            type: string
          canonical_url_sha256:
            type: string
            pattern: ^[0-9a-f]{64}$
    SourcePreparation:
      type: object
      required:
      - version
      - key
      - state
      properties:
        version:
          const: 1
          type: integer
        key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^(?!\.{1,2}$)[!-~]+$
        state:
          type: string
          enum:
          - processing
          - ready
          - retryable
          - failed
        source_id:
          type: string
        source:
          $ref: '#/components/schemas/Source'
        fingerprint:
          $ref: '#/components/schemas/SourceFingerprint'
        retry_after_ms:
          type: integer
          minimum: 1
        error:
          type: object
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
    AgentProjectCreate:
      type: object
      additionalProperties: false
      required:
      - source_id
      - plan
      - collection_key
      properties:
        source_id:
          type: string
        plan:
          $ref: '#/components/schemas/CollectionPlan'
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        rendition:
          type: string
          enum:
          - final
          - draft
          default: final
        collection_key:
          type: string
          minLength: 1
          x-maxBytes: 128
        job_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
          description: Explicit selected owned jobs, each matching one unambiguous current effective clip request. Includes
            distinct repair attempts.
        clip_jobs:
          type: array
          maxItems: 128
          description: Explicit stable clip/job bindings; supports different clips with identical edit decisions. Mutually exclusive with job_ids. Every job must belong to the owner and exactly match its selected clip.
          items:
            type: object
            additionalProperties: false
            required: [clip_id, job_id]
            properties:
              clip_id:
                type: string
                pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
              job_id:
                type: string
                minLength: 1
    AgentProjectEdit:
      type: object
      additionalProperties: false
      required:
      - revision
      - plan
      properties:
        revision:
          type: integer
          minimum: 1
        plan:
          $ref: '#/components/schemas/CollectionPlan'
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        rendition:
          type: string
          enum:
          - final
          - draft
          default: final
    AgentProjectSelection:
      type: object
      additionalProperties: false
      properties:
        revision:
          type: integer
          minimum: 1
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          minItems: 1
    AgentProjectRetry:
      type: object
      additionalProperties: false
      required:
      - revision
      - clip_ids
      properties:
        revision:
          type: integer
          minimum: 1
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
          minItems: 1
    SubtitleRetimeRequest:
      type: object
      additionalProperties: false
      required: [version, format, text, outputs]
      properties:
        version: {type: integer, enum: [1, 2], description: Version 1 retains historical clipping; version 2 scales supplied cues to actual source/output segment spans.}
        format: {type: string, enum: [srt, vtt]}
        text: {type: string, maxLength: 524288, description: At most 512 KiB of valid UTF-8 supplied text}
        output_format: {type: string, enum: [srt, vtt], description: Defaults to the input format}
        outputs:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [clip_id, segments]
            properties:
              clip_id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
              segments:
                type: array
                minItems: 1
                maxItems: 128
                items: {$ref: '#/components/schemas/ArtifactSegment'}
    SubtitleRetimeResult:
      type: object
      additionalProperties: false
      required: [version, outputs]
      properties:
        version: {type: integer, const: 1}
        outputs:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            additionalProperties: false
            required: [clip_id, format, text, cue_count, sha256]
            properties:
              clip_id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
              format: {type: string, enum: [srt, vtt]}
              text: {type: string, maxLength: 8388608}
              cue_count: {type: integer, minimum: 0, maximum: 100000}
              sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    AgentProject:
      type: object
      required:
      - version
      - id
      - revision
      - source_id
      - source
      - plan
      - rendition
      - jobs
      - clips
      - expires_at
      properties:
        version:
          type: integer
          const: 1
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        source_id:
          type: string
        source:
          $ref: '#/components/schemas/Source'
        plan:
          $ref: '#/components/schemas/CollectionPlan'
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9][a-z0-9_-]{0,63}$
        rendition:
          type: string
          enum:
          - final
          - draft
          default: final
        jobs:
          type: array
          maxItems: 128
          items:
            type: object
            required:
            - clip_id
            - job
            - request
            - current
            properties:
              clip_id:
                type: string
              job:
                $ref: '#/components/schemas/Job'
              request:
                $ref: '#/components/schemas/ExportRequest'
              current:
                type: boolean
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required:
            - clip_id
            - request
            properties:
              clip_id:
                type: string
              request:
                $ref: '#/components/schemas/ExportRequest'
        expires_at:
          type: string
          format: date-time
        access_expires_at:
          type: string
          format: date-time
