openapi: 3.1.0
info:
  title: cutmyvideo-core HTTP API
  version: 0.1.0
  description: Manual media selection and asynchronous separate-fragment export.
servers:
  - url: /
security:
  - SessionCookie: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database is reachable}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/session:
    get:
      security: []
      description: Creates an anonymous HttpOnly capability cookie if absent.
      responses:
        '200':
          description: Session initialized
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean, const: true}
                  limits:
                    type: object
                    description: Public admission policy; contains no private configuration.
                    properties:
                      max_source_bytes: {type: integer, minimum: 1}
                      max_ranges: {type: integer, minimum: 1, maximum: 128}
                      max_range_ms: {type: integer, minimum: 1}
                      max_job_ms: {type: integer, minimum: 1}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/sources:
    get:
      description: The session owner's newest sources, at most 20. Empty sessions return an empty array.
      responses:
        '200':
          description: Owner source list
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    maxItems: 20
                    items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: JSON body reads are limited to ten seconds or an earlier request deadline; stalled requests return 408 request_timeout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url:
                  type: string
                  maxLength: 8192
                  description: Public HTTPS media URL or recognized platform recording/clip link. Known platform hosts accept HTTP/schemeless pastes and normalize to HTTPS before fetching. YouTube watch, short-link, Shorts, recorded-live and embed URLs become a canonical watch link; access-essential parameters for other platforms are preserved. Actual live and collection links are rejected.
                  examples: ['https://www.youtube.com/watch?v=aqz-KE-bpKQ', 'youtu.be/aqz-KE-bpKQ', 'https://cdn.example.com/interview.mp4']
      responses:
        '201': {$ref: '#/components/responses/Source'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/uploads:
    post:
      description: Uploads one file within the configured UPLOAD_TIMEOUT, including quota admission, multipart body transfer and media inspection. Timeout returns 504 source_timeout; interrupted uploads return 400 invalid_upload; oversize uploads return 413 source_too_large.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '201': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      description: Deletes the owner source, its terminal jobs and all outputs. Active queued/running/waiting_storage exports return 409 source_in_use. Physical deletion is retryable and remains charged until successful; clients must confirm destructive intent.
      responses:
        '204': {description: Source and associated terminal resources removed}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      responses:
        '200': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/media:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Original staged bytes; requires owner session. Range supported. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '200': {description: Media bytes}
        '206': {description: Requested byte range}
        '304': {description: Authorized preview is unchanged; use the privately cached bytes}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/preview:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected H.264/AAC MP4 interval, up to 30 seconds and 16 MiB. Works for accessible platform recordings and staged files with browser-incompatible codecs. Original source time is supplied in response headers. Temporary media is removed after the response; no-store. A preview pins the source against deletion and uses a bounded shared storage reservation.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Preview interval
          headers:
            X-Preview-Start-MS: {schema: {type: integer}}
            X-Preview-End-MS: {schema: {type: integer}}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected, bounded and inspected PNG/JPEG thumbnail. Raw CDN URLs are never returned to clients. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '200': {description: Thumbnail image}
        '206': {description: Requested byte range}
        '304': {description: Authorized thumbnail is unchanged; use the privately cached image}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    post:
      description: JSON body reads are limited to ten seconds; stalled requests return 408 request_timeout.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string, maxLength: 128}
          description: Reusing the key for this session returns the original job.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202': {$ref: '#/components/responses/Job'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      description: Queued and waiting_storage cancellation is immediate; running cancellation settles asynchronously.
      responses:
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/artifacts/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-authorized attachment. Range supported.
      responses:
        '200': {description: Exported file}
        '206': {description: Requested byte range}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cutmy_session
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: {type: string}
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Source:
      description: Prepared source
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Source'}
    Job:
      description: Export job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Source:
      type: object
      required: [id, title, duration_ms, kind, provider, provider_video_id, source_url, preview_kind, preview_url, embed_url, thumbnail_url, expires_at, retention_blocked]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: RFC3339 source retention target, or null while linked jobs pin the source.}
        retention_blocked: {type: boolean, description: A retained job currently pins this source.}
        title: {type: string}
        duration_ms: {type: integer, minimum: 1}
        kind: {type: string, enum: [upload, direct, youtube, platform]}
        provider:
          type: string
          enum: [upload, direct, generic, youtube, twitch, rutube, tiktok, instagram, vimeo, dailymotion, vk, facebook, x, reddit, ok, bilibili, streamable, rumble]
          description: Recognized extractor family; a provider name is not a guarantee of link availability.
        provider_video_id: {type: [string, 'null']}
        source_url:
          type: [string, 'null']
          description: HTTPS platform page URL; null for uploads and direct files. Never an extracted CDN media address.
        preview_kind: {type: string, enum: [native, youtube, window, none]}
        preview_url: {type: [string, 'null']}
        embed_url: {type: [string, 'null']}
        thumbnail_url:
          type: [string, 'null']
          description: Relative owner-protected thumbnail endpoint, or null. Never a raw external image URL.
        width: {type: integer}
        height: {type: integer}
    Range:
      type: object
      additionalProperties: false
      required: [start_ms, end_ms]
      properties:
        start_ms: {type: integer, minimum: 0}
        end_ms: {type: integer, minimum: 1}
        label: {type: string, description: Optional label; maximum 200 UTF-8 bytes}
    ExportRequest:
      type: object
      additionalProperties: false
      required: [source_id, ranges, format, quality, cut_mode]
      properties:
        source_id: {type: string}
        ranges:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Range'}
        format: {type: string, enum: [mp4, mp3]}
        quality: {type: string, enum: [1080p, 720p, best]}
        cut_mode: {type: string, enum: [accurate, copy], description: MP3 requires accurate. Copy preserves source resolution; select best for original quality. A lower explicit cap fails with copy_quality_unsupported instead of silently resizing or exceeding the cap.}
    Artifact:
      type: object
      required: [id, filename, size_bytes, download_url, actual_start_ms, actual_end_ms, expires_at]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: Immutable result retention deadline, or null while an active job pins the result.}
        filename: {type: string}
        size_bytes: {type: integer}
        download_url: {type: string}
        actual_start_ms: {type: integer}
        actual_end_ms: {type: integer}
    JobItem:
      type: object
      required: [id, label, start_ms, end_ms, status, artifact]
      properties:
        id: {type: string}
        label: {type: string}
        start_ms: {type: integer}
        end_ms: {type: integer}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress_ms:
          type: integer
          minimum: 0
          description: Optional processed media time from FFmpeg, in milliseconds. Omitted before progress is available and in legacy jobs. Encoding can finish before file validation/publication; only succeeded status makes an artifact ready. A cached-address refresh may reset progress.
        message: {type: string}
        error_code:
          type: string
          description: Optional fixed public diagnostic on failed/cancelled items. Legacy items can omit it. Localize known codes and use a safe generic fallback for unknown ones; never display raw subprocess output.
          enum: [audio_missing, output_limit, platform_access_required, platform_unavailable, unsupported_stream, live_not_supported, unsupported_collection, media_upstream_denied, media_upstream_unavailable, media_network_timeout, media_network_reset, copy_incompatible, copy_quality_unsupported, media_processing_failed, source_expired, source_changed, source_timeline_changed, source_timeout, job_timeout, storage_full, storage_timeout, storage_limit, server_error, cancelled]
        artifact:
          oneOf:
            - {$ref: '#/components/schemas/Artifact'}
            - {type: 'null'}
    Job:
      type: object
      required: [id, status, stage, message, items, storage_wait_until]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, waiting_storage, succeeded, failed, cancelled]}
        storage_wait_until: {type: [string, 'null'], format: date-time, description: Finite persisted storage wait deadline; null before the first storage wait.}
        stage: {type: string}
        message: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/JobItem'}
