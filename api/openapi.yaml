openapi: 3.1.0
info:
  title: cutmyvideo-core HTTP API
  version: 1.6.0
  description: >-
    Manual media selection and asynchronous separate or joined export. Clients
    must ignore unknown response fields and accept unknown additive error codes
    with a generic fallback. Human messages are not stable identifiers.
servers:
  - url: /
security:
  - SessionCookie: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database is reachable}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/session:
    get:
      security: []
      description: Creates an anonymous HttpOnly capability cookie if absent.
      responses:
        '200':
          description: Session initialized
          content:
            application/json:
              schema:
                type: object
                required: [ok, limits]
                properties:
                  ok: {type: boolean, const: true}
                  limits:
                    type: object
                    description: Public admission policy; contains no private configuration.
                    required: [max_source_bytes, max_output_bytes, max_fetch_bytes, max_ranges, max_range_ms, max_job_ms]
                    properties:
                      max_source_bytes: {type: integer, minimum: 1}
                      max_output_bytes: {type: integer, minimum: 1, description: Maximum bytes in one exported file}
                      max_fetch_bytes: {type: integer, minimum: 1, description: Aggregate remote media transfer budget for one export job}
                      max_ranges: {type: integer, minimum: 1, maximum: 128}
                      max_range_ms: {type: integer, minimum: 1}
                      max_job_ms: {type: integer, minimum: 1}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/sources:
    get:
      description: The session owner's newest sources, at most 20. Empty sessions return an empty array.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200':
          description: Owner source list
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    maxItems: 20
                    items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^(?!\.{1,2}$)[!-~]+$
          description: Owner-scoped immutable intent key. Persist before the first request and reconcile its receipt before
            replaying an uncertain response.
      description: JSON body reads are limited to ten seconds or an earlier request deadline; stalled requests return 408 request_timeout. Final source registration can already have committed when a timeout or connection failure is reported; check the same session's source list before deciding to repeat the import. With an optional Idempotency-Key, the normalized URL is an immutable owner-scoped intent; replay returns the same source (200), changed intent is 409, and GET source-preparations/{key} reconciles uncertain responses. Without a key, legacy imports have no idempotency guarantee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url:
                  type: string
                  x-maxBytes: 8192
                  description: Maximum 8192 UTF-8 bytes, both before and after URL normalization. Public HTTPS media URL or recognized platform recording/clip link. Known platform hosts accept HTTP/schemeless pastes and normalize to HTTPS before fetching. YouTube watch, short-link, Shorts, recorded-live and embed URLs become a canonical watch link; access-essential parameters for other platforms are preserved. Actual live and collection links are rejected.
                  examples: ['https://www.youtube.com/watch?v=aqz-KE-bpKQ', 'youtu.be/aqz-KE-bpKQ', 'https://cdn.example.com/interview.mp4']
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200': {$ref: '#/components/responses/Source'}
        '201': {$ref: '#/components/responses/Source'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/uploads:
    post:
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^(?!\.{1,2}$)[!-~]+$
          description: Owner-scoped immutable intent key. Persist before the first request and reconcile its receipt before
            replaying an uncertain response.
        - in: header
          name: Upload-SHA256
          required: false
          schema:
            type: string
            pattern: ^[0-9a-f]{64}$
          description: Required with Idempotency-Key; SHA256 of full original file bytes.
        - in: header
          name: Upload-Size
          required: false
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Required with Idempotency-Key; full original file size in bytes.
      description: Uploads one file within the configured UPLOAD_TIMEOUT, including quota admission, multipart body transfer and media inspection. Timeout returns 504 source_timeout; final source registration can already have committed despite this response, so check the same session's source list before deciding to repeat the upload. With an optional Idempotency-Key, Upload-SHA256 and Upload-Size are required; the server verifies the complete bytes and persists the fingerprint with the source. Replay returns the same source (200) before reading its body, changed intent is 409, and GET source-preparations/{key} reconciles uncertain responses. Without a key, legacy uploads have no idempotency guarantee. Interrupted uploads return 400 invalid_upload; oversize uploads return 413 source_too_large.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200': {$ref: '#/components/responses/Source'}
        '201': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      description: Deletes the owner source, its terminal jobs and all outputs. Active queued/running/waiting_storage exports return 409 source_in_use. Physical deletion is retryable and remains charged until successful; clients must confirm destructive intent.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '204': {description: Source and associated terminal resources removed}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/tracks:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Returns 410 source_removed after automatic media cleanup. Fresh owner-protected track inspection for a staged local upload/direct source. Audio indices are absolute source stream indices. Platform sources without a staged file return tracks_unavailable; their deterministic default audio or no-audio export remains available.
      responses:
        '200':
          description: Available source tracks
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  display_width: {type: integer, minimum: 2, description: Upright square-pixel display width from fresh inspection; omitted for unsupported geometry or audio-only sources.}
                  display_height: {type: integer, minimum: 2, description: Upright square-pixel display height from fresh inspection; omitted for unsupported geometry or audio-only sources.}
                  tracks:
                    type: array
                    items: {$ref: '#/components/schemas/Track'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/media:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Returns 410 source_removed after automatic media cleanup. Original staged bytes; requires owner session. Range supported. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {description: Media bytes}
        '206': {description: Requested byte range}
        '304': {description: Authorized preview is unchanged; use the privately cached bytes}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/preview:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected H.264/AAC MP4 interval, up to 30 seconds and 16 MiB. Optional 6000 ms windows reduce cold foreground latency; their alignment and cache identity are separate from ordinary 30000 ms windows. Short foreground requests briefly wait for occupied inspection capacity under the same admission limits. Works for accessible platform recordings and staged files with browser-incompatible codecs. Original source time and fresh upright square-pixel source display dimensions are supplied in response headers, including cache hits and conditional/range responses. Display dimensions describe the original before preview scaling, suitable for normalized crop presets. Aligned windows are retained in a private owner-protected cache for up to 30 idle minutes (512 MiB globally, 128 MiB per owner). Responses remain no-store. Rendering pins the source and uses a bounded reservation; completed cache entries do not pin sources. Duplicate interval requests coalesce.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: window_ms
          schema: {type: integer, enum: [6000, 30000], default: 30000}
          description: Video window length and alignment; omission preserves the ordinary 30-second contract.
        - in: query
          name: priority
          schema: {type: string, default: foreground, examples: [foreground, background]}
          description: background prefetch yields rendering capacity to foreground requests; omission or any other value uses foreground priority.
        - in: query
          name: audio_track
          schema: {type: integer, minimum: 0}
          description: Absolute inspected audio stream index for a staged local source. Its selection is included in the private preview cache identity.
        - in: query
          name: no_audio
          schema: {type: boolean}
          description: true renders silent video; cannot be combined with audio_track. Omission selects default audio, otherwise the first audio stream.
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200':
          description: Preview interval
          headers:
            X-Source-Display-Width: {description: Original upright square-pixel width before preview scaling, schema: {type: integer, minimum: 2}}
            X-Source-Display-Height: {description: Original upright square-pixel height before preview scaling, schema: {type: integer, minimum: 2}}
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '206': {description: Requested preview byte range, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '304': {description: Authorized preview is unchanged; empty response body, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '412': {description: A request precondition failed; empty response body, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '416':
          description: Malformed or unsatisfiable preview Range; plain text
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
            Content-Range: {schema: {type: string, pattern: '^bytes \*/[0-9]+$'}}
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/storyboard:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected JPEG search strip for the aligned 30-second source interval. Six fixed 160x90 cells sample source time at start_ms plus 0, 5, 10, 15, 20 and 25 seconds. X-Storyboard-Frames identifies used cells; unused cells near source end are black. Video aspect ratio is preserved within each cell. No audio is prepared. The operation always uses background admission in the shared preview pool and returns server_busy when another renderer is active. It shares private preview cache size/count/expiry limits and source deletion. Preparation is canceled when the request ends; completed bytes remain no-store.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: priority
          schema: {type: string, examples: [background]}
          description: Accepted for consistency with preview clients; storyboards always use background admission.
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200':
          description: 960x90 JPEG sprite, at most 256 KiB
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
            X-Storyboard-Step-MS:
              x-required: true
              schema: {type: integer, const: 5000}
            X-Storyboard-Frames:
              x-required: true
              schema: {type: integer, minimum: 1, maximum: 6}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '206': {description: Requested storyboard byte range}
        '304': {description: Authorized storyboard is unchanged; empty response body}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/waveform:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected peaks for an aligned 30-second source window. One absolute peak per 100 ms across every channel of the selected audio track; silent sources return zero peaks with has_audio false. Source timestamps remain global when a remote interval is staged. Always background admission in the shared preview pool, with the same bounded private cache, cancellation and cleanup. No whole-recording decode is started. Removed originals return 410 source_removed.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: audio_track
          schema: {type: integer, minimum: 0}
          description: Absolute audio stream index for staged local media; omission uses default audio, otherwise the first audio stream.
        - in: query
          name: no_audio
          schema: {type: boolean}
          description: true returns silence; cannot be combined with audio_track.
        - in: query
          name: priority
          schema: {type: string, examples: [background]}
          description: Accepted for consistency; waveforms always use background admission.
      responses:
        '200':
          description: Bounded JSON waveform, less than 64 KiB; private no-store response
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Waveform'}
        '206': {description: Requested waveform byte range}
        '304': {description: Authorized waveform is unchanged; empty body}
        '410': {$ref: '#/components/responses/Error'}
        '412': {description: Failed precondition; empty body}
        '416': {$ref: '#/components/responses/RangeError'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected, bounded and inspected PNG/JPEG thumbnail. Raw CDN URLs are never returned to clients. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {description: Thumbnail image}
        '206': {description: Requested byte range}
        '304': {description: Authorized thumbnail is unchanged; use the privately cached image}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      description: Up to 30 owner-only exports, active jobs first and newest first within each group. Contains only retained files with private download URLs.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200':
          description: Export history
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    maxItems: 30
                    items: {$ref: '#/components/schemas/JobSummary'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: JSON body reads are limited to ten seconds; stalled requests return 408 request_timeout.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string, x-maxBytes: 128}
          description: Maximum 128 UTF-8 bytes. Reusing the key for this session returns the retained original job before current source/admission limits or the per-owner new-export allowance, even if the body changes; use a fresh key for different work. Session, origin, JSON/key bounds and ordinary IP/session request guards still apply. Once retention cleanup or source deletion removes the original job, its key no longer recovers it. A failed mutation can already have committed, including database_unavailable or an earlier request timeout; recover this submission with the same key rather than a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '202': {$ref: '#/components/responses/Job'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/preflight:
    post:
      description: Checks an export request without creating a job, downloading remote media, or reserving export outputs. Local media uses bounded owner-protected inspection and temporary reader leases. Remote sources receive metadata-only validation with explicitly deferred media, track, geometry and tool checks. Valid means the reported prerequisites passed; decoding, encoding, container compatibility, output size, queue/storage admission and publication can still fail during execution. A later export independently rechecks the source. No Idempotency-Key is consumed or recovered. Strict JSON body reads are limited to 1 MiB and ten seconds; source inspection uses the configured SOURCE_TIMEOUT. The endpoint shares ordinary session, origin and request guards and allows at most 30 job inspections per session per minute independently of new-export allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '200':
          description: Known prerequisites passed, with deferred execution checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreflightResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '422':
          description: Local media prerequisites or configured tool capabilities are unavailable, including unsupported_media, audio_missing, audio_track_unavailable, copy_quality_unsupported, subtitle_unsupported, encoder_unavailable, filter_unavailable, muxer_unavailable, demuxer_unavailable, bitstream_filter_unavailable or tool_unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503':
          description: Bounded database or inspection admission failure, including database_unavailable, storage_initializing or server_busy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/collections/validate:
    post:
      description: Validates selected clips from a versioned single-source plan without encoding or creating jobs. Each clip joins its intervals in submitted order with its own inherited/overridden settings. Selected intervals and total duration share the existing MAX_RANGES/MAX_JOB_MS budgets. Unselected clip IDs, labels and structural bounds are checked; their media edits can remain unfinished. Local clips receive fresh protected media/tool preflight; remote clips receive metadata-only reports with explicit deferred checks. Requires the same owner session, same-origin guard, 1 MiB strict JSON body and ten-second body timeout as jobs. The whole local collection shares SOURCE_TIMEOUT and one inspection/reader admission. Shares the 30 preflight requests per session per minute allowance with job preflight. No idempotency key is consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionRequest'}
      responses:
        '200':
          description: Known selected-clip prerequisites passed; execution checks remain deferred
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionValidation'}
        default:
          description: Collection validation failed; clip_id and field identify known plan/media blockers when available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionError'}
  /api/v1/collections:
    post:
      description: Adapts selected collection clips to ordinary joined jobs in the existing queue. Requires a workflow Idempotency-Key; per-clip identities include that key, clip ID/label and the normalized effective request, including rendition. Retry the same plan/key to recover retained jobs and admit pending clips after capacity is available. Editing one clip creates new work only for that clip; other retained jobs stay available. A fresh key intentionally starts new work. Collection admission is incremental and preserves the existing three active jobs per owner, global queue, storage and ten new-export attempts per session per minute limits; a 15-clip plan can require several retries as jobs finish. Retained jobs recover before current source-duration, source-media, operator-budget, inspection and export allowance checks. Source ownership, strict JSON, supported plan shape/options and unique selection remain enforced. Only newly pending clips are validated against the actual source and aggregate current budgets; identity-only normalization never authorizes fresh work. Already retained jobs remain in a partial response when pending validation fails. Local pending clips share one fresh preflight admission and SOURCE_TIMEOUT before any new jobs are created; remote media is inspected by the worker. A response containing any retained/admitted job is 202 even if other clips have errors. complete describes admission only, never completed encoding. Poll/cancel/download each job using the existing owner-protected endpoints. Non-admitted retryable clips should be retried with the same workflow key and plan; uncertain database commits are recovered by the same per-clip keys. A terminal failed/cancelled job is still retained and recovered; use a fresh workflow key to intentionally rerun it. No collection database/project is created.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, x-maxBytes: 128}
          description: A nonblank workflow key, maximum 128 UTF-8 bytes. Stable across retries and edits to this collection; unlike POST jobs, edited effective clip requests receive new per-clip jobs. Retention limits recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionRequest'}
      responses:
        '202':
          description: At least one clip job is retained/admitted; inspect complete and every clip error before retrying pending work
          headers:
            Retry-After:
              description: Present when pending clips hit rate or queue limits; wait this many seconds before retrying
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionSubmission'}
        default:
          description: Request guard error, or a collection submission report with no admitted jobs (400 plan, 404 source, 410 removed media, 413 storage budget, 422 media, 429 admission, 503 database/inspection or 504 inspection timeout)
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/CollectionError'}
                  - {$ref: '#/components/schemas/CollectionSubmission'}
  /api/v1/source-preparations/{key}:
    get:
      description: Recovers the owner-scoped preparation receipt before repeating an uncertain upload/import. 404
        means no retained receipt. Processing exposes Retry-After; retryable permits the same intent/key to reclaim
        an expired or released lease. Ready includes the persisted source/fingerprint; a removed source remains explicit
        source_unavailable while the receipt is retained. Receipts expire after seven days only when their source
        is absent; a retained source preserves its key and cannot be duplicated by receipt expiry. Maximum 64 retained
        receipts per owner.
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^(?!\.{1,2}$)[!-~]+$
      responses:
        '200':
          description: Retained source preparation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourcePreparation'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects:
    post:
      description: 'Creates a seven-day single-source project scoped to explicit owned job IDs. The saved collection_key
        is its immutable owner-scoped identity: repeat it after a lost reply to recover the same current project without
        overwriting browser edits; changing its fixed source returns project_conflict. New identity requires a new
        key. Replay precedes current source/admission checks. At most 20 projects per owner, ten new creations per
        minute; creation does not render or extend source retention. Only the creator keeps the collection key.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProject'
        '200':
          description: Current retained project recovered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProject'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    get:
      description: Creator or unexpired project recipient only. Includes server-normalized selected expected requests
        and latest explicitly attached jobs. current is true only when that job matches the current effective clip
        request; false rows must not be adopted as current outputs. Responses contain no creator cookie or collection
        key.
      responses:
        '200':
          description: Current scoped project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProject'
        default:
          $ref: '#/components/responses/Error'
    put:
      description: Compare-and-swap saved edits/selection/rendition with revision. Stale revisions return project_conflict.
        This saves metadata and does not render. Fixed source and collection key cannot be changed. Same-origin and
        mutation admission checks apply.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectEdit'
      responses:
        '200':
          description: Saved project with incremented revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentProject'
        default:
          $ref: '#/components/responses/Error'
    delete:
      description: Creator only. Revokes all project tokens/grants and removes project metadata. Does not delete source,
        jobs or artifacts.
      responses:
        '200':
          description: Project revoked
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                properties:
                  ok:
                    type: boolean
                    const: true
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/grants:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    delete:
      description: Creator only. Revokes all outstanding tokens and browser grants immediately for new requests; retained
        source/jobs/artifacts stay owned by the creator.
      responses:
        '200':
          description: All project grants revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                required:
                - ok
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/handoffs:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    post:
      description: Creator only. Issues a random single-recipient token, valid ten minutes. Only its hash is stored.
        At most eight unexpired tokens per project and ten creations per owner per minute. Transport to the browser
        in a URL fragment only; remove the fragment before any requests, then POST the token in the redeem body. Never
        put tokens in query parameters, logs, persistent browser storage or owner cookies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Private handoff; no-store
          content:
            application/json:
              schema:
                type: object
                required:
                - project_id
                - token
                - expires_at
                properties:
                  project_id:
                    type: string
                  token:
                    type: string
                    pattern: ^[A-Za-z0-9_-]{43}$
                  expires_at:
                    type: string
                    format: date-time
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/handoffs/redeem:
    post:
      description: Redeems a handoff using the browser’s ordinary session, without replacing its cookie. One recipient
        receives a project-only grant for at most 24 hours or project expiry. The same recipient can replay the token
        until token expiry to recover a lost reply without extending the grant; another session receives 404. Bounded
        to twenty attempts per recipient per minute, twenty grants per recipient and thirty-two recipients per project.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
      responses:
        '200':
          description: Scoped project granted
          content:
            application/json:
              schema:
                type: object
                required:
                - project
                properties:
                  project:
                    $ref: '#/components/schemas/AgentProject'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/collections:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    post:
      description: Submits only the saved current plan/source and selection. Optional revision enforces CAS; optional
        clip_ids must be a nonempty unique subset of the saved selection. Empty object keeps legacy all-selected behavior.
        Uses the server-held workflow key; latest attached matching jobs, including explicit repair attempts, are
        retained. Newly pending clips keep all ordinary collection budgets/admission checks. The browser receives
        no key. SDKs adopting this project must use this scoped route for pending submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectSelection'
      responses:
        '202':
          description: Incremental collection admission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSubmission'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/collections/validate:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    post:
      description: Validates only the saved current plan/source and selection. Optional revision enforces CAS; optional
        clip_ids must be a nonempty unique subset of the saved selection. Empty object keeps legacy all-selected behavior.
        Uses the server-held workflow key; latest attached matching jobs, including explicit repair attempts, are
        retained. Newly pending clips keep all ordinary collection budgets/admission checks. The browser receives
        no key. SDKs adopting this project must use this scoped route for pending submissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectSelection'
      responses:
        '200':
          description: Collection validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionValidation'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/collections/retry:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    post:
      description: Starts an explicit attempt only for current failed/cancelled clips or succeeded clips with no unexpired
        ready artifact. Requires a saved revision, selection and caller Idempotency-Key. The immutable attempt receipt
        is saved before admission. Replaying the same key/body recovers accepted or pending work before current failed-status
        checks; changed intent returns project_conflict. A new key cannot retry a queued or ready result. Each admitted
        job is attached to this project for browser/SDK recovery. At most 1024 retained retry receipts and job associations
        per project.
      parameters:
      - in: header
        name: Idempotency-Key
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^(?!\.{1,2}$)[!-~]+$
        description: Owner-scoped immutable intent key. Persist before the first request and reconcile its receipt
          before replaying an uncertain response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentProjectRetry'
      responses:
        '202':
          description: Explicit attempt retained/admitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSubmission'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      responses:
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        '200':
          $ref: '#/components/responses/Source'
        default:
          $ref: '#/components/responses/Error'
      description: 'Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. '
  /api/v1/projects/{project}/sources/{id}/media:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Returns 410 source_removed after automatic media cleanup. Original staged bytes;
        requires owner session. Range supported. Private conditional caching with ETag requires owner and file revalidation
        on every request.
      responses:
        '503':
          $ref: '#/components/responses/DatabaseUnavailable'
        '200':
          description: Media bytes
        '206':
          description: Requested byte range
        '304':
          description: Authorized preview is unchanged; use the privately cached bytes
        '412':
          description: A request precondition failed; empty response body
        '416':
          $ref: '#/components/responses/RangeError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}/preview:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Owner-protected H.264/AAC MP4 interval, up to 30 seconds and 16 MiB. Optional 6000
        ms windows reduce cold foreground latency; their alignment and cache identity are separate from ordinary 30000
        ms windows. Short foreground requests briefly wait for occupied inspection capacity under the same admission
        limits. Works for accessible platform recordings and staged files with browser-incompatible codecs. Original
        source time and fresh upright square-pixel source display dimensions are supplied in response headers, including
        cache hits and conditional/range responses. Display dimensions describe the original before preview scaling,
        suitable for normalized crop presets. Aligned windows are retained in a private owner-protected cache for
        up to 30 idle minutes (512 MiB globally, 128 MiB per owner). Responses remain no-store. Rendering pins the
        source and uses a bounded reservation; completed cache entries do not pin sources. Duplicate interval requests
        coalesce.
      parameters:
      - in: query
        name: start_ms
        required: true
        schema:
          type: integer
          minimum: 0
      - in: query
        name: window_ms
        schema:
          type: integer
          enum:
          - 6000
          - 30000
          default: 30000
        description: Video window length and alignment; omission preserves the ordinary 30-second contract.
      - in: query
        name: priority
        schema:
          type: string
          default: foreground
          examples:
          - foreground
          - background
        description: background prefetch yields rendering capacity to foreground requests; omission or any other value
          uses foreground priority.
      - in: query
        name: audio_track
        schema:
          type: integer
          minimum: 0
        description: Absolute inspected audio stream index for a staged local source. Its selection is included in
          the private preview cache identity.
      - in: query
        name: no_audio
        schema:
          type: boolean
        description: true renders silent video; cannot be combined with audio_track. Omission selects default audio,
          otherwise the first audio stream.
      responses:
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '200':
          description: Preview interval
          headers:
            X-Source-Display-Width:
              description: Original upright square-pixel width before preview scaling
              schema:
                type: integer
                minimum: 2
            X-Source-Display-Height:
              description: Original upright square-pixel height before preview scaling
              schema:
                type: integer
                minimum: 2
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: Requested preview byte range
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
        '304':
          description: Authorized preview is unchanged; empty response body
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
        '412':
          description: A request precondition failed; empty response body
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
        '416':
          description: Malformed or unsatisfiable preview Range; plain text
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
            Content-Range:
              schema:
                type: string
                pattern: ^bytes \*/[0-9]+$
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}/storyboard:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Owner-protected JPEG search strip for the aligned 30-second source interval. Six
        fixed 160x90 cells sample source time at start_ms plus 0, 5, 10, 15, 20 and 25 seconds. X-Storyboard-Frames
        identifies used cells; unused cells near source end are black. Video aspect ratio is preserved within each
        cell. No audio is prepared. The operation always uses background admission in the shared preview pool and
        returns server_busy when another renderer is active. It shares private preview cache size/count/expiry limits
        and source deletion. Preparation is canceled when the request ends; completed bytes remain no-store.
      parameters:
      - in: query
        name: start_ms
        required: true
        schema:
          type: integer
          minimum: 0
      - in: query
        name: priority
        schema:
          type: string
          examples:
          - background
        description: Accepted for consistency with preview clients; storyboards always use background admission.
      responses:
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '200':
          description: 960x90 JPEG sprite, at most 256 KiB
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
            X-Storyboard-Step-MS:
              x-required: true
              schema:
                type: integer
                const: 5000
            X-Storyboard-Frames:
              x-required: true
              schema:
                type: integer
                minimum: 1
                maximum: 6
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '206':
          description: Requested storyboard byte range
        '304':
          description: Authorized storyboard is unchanged; empty response body
        '412':
          description: A request precondition failed; empty response body
        '416':
          $ref: '#/components/responses/RangeError'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}/waveform:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Owner-protected peaks for an aligned 30-second source window. One absolute peak per
        100 ms across every channel of the selected audio track; silent sources return zero peaks with has_audio false.
        Source timestamps remain global when a remote interval is staged. Always background admission in the shared
        preview pool, with the same bounded private cache, cancellation and cleanup. No whole-recording decode is
        started. Removed originals return 410 source_removed.
      parameters:
      - in: query
        name: start_ms
        required: true
        schema:
          type: integer
          minimum: 0
      - in: query
        name: audio_track
        schema:
          type: integer
          minimum: 0
        description: Absolute audio stream index for staged local media; omission uses default audio, otherwise the
          first audio stream.
      - in: query
        name: no_audio
        schema:
          type: boolean
        description: true returns silence; cannot be combined with audio_track.
      - in: query
        name: priority
        schema:
          type: string
          examples:
          - background
        description: Accepted for consistency; waveforms always use background admission.
      responses:
        '200':
          description: Bounded JSON waveform, less than 64 KiB; private no-store response
          headers:
            X-Preview-Cache:
              $ref: '#/components/headers/PreviewCache'
            X-Preview-Start-MS:
              $ref: '#/components/headers/PreviewStart'
            X-Preview-End-MS:
              $ref: '#/components/headers/PreviewEnd'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Waveform'
        '206':
          description: Requested waveform byte range
        '304':
          description: Authorized waveform is unchanged; empty body
        '410':
          $ref: '#/components/responses/Error'
        '412':
          description: Failed precondition; empty body
        '416':
          $ref: '#/components/responses/RangeError'
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}/tracks:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Returns 410 source_removed after automatic media cleanup. Fresh owner-protected track
        inspection for a staged local upload/direct source. Audio indices are absolute source stream indices. Platform
        sources without a staged file return tracks_unavailable; their deterministic default audio or no-audio export
        remains available.
      responses:
        '200':
          description: Available source tracks
          content:
            application/json:
              schema:
                type: object
                required:
                - tracks
                properties:
                  display_width:
                    type: integer
                    minimum: 2
                    description: Upright square-pixel display width from fresh inspection; omitted for unsupported
                      geometry or audio-only sources.
                  display_height:
                    type: integer
                    minimum: 2
                    description: Upright square-pixel display height from fresh inspection; omitted for unsupported
                      geometry or audio-only sources.
                  tracks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Track'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/projects/{project}/sources/{id}/thumbnail:
    parameters:
    - in: path
      name: project
      required: true
      schema:
        type: string
    - $ref: '#/components/parameters/ID'
    get:
      description: Project-only access to the fixed source; a different source ID is refused. Ordinary preview/media/tool
        limits remain unchanged. Owner-protected, bounded and inspected PNG/JPEG thumbnail. Raw CDN URLs are never
        returned to clients. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '503':
