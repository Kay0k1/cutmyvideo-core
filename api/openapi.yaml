openapi: 3.1.0
info:
  title: cutmyvideo-core HTTP API
  version: 1.2.0
  description: >-
    Manual media selection and asynchronous separate or joined export. Clients
    must ignore unknown response fields and accept unknown additive error codes
    with a generic fallback. Human messages are not stable identifiers.
servers:
  - url: /
security:
  - SessionCookie: []
paths:
  /healthz:
    get:
      security: []
      responses:
        '200': {description: Process is alive}
  /readyz:
    get:
      security: []
      responses:
        '200': {description: Database is reachable}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/session:
    get:
      security: []
      description: Creates an anonymous HttpOnly capability cookie if absent.
      responses:
        '200':
          description: Session initialized
          content:
            application/json:
              schema:
                type: object
                required: [ok, limits]
                properties:
                  ok: {type: boolean, const: true}
                  limits:
                    type: object
                    description: Public admission policy; contains no private configuration.
                    required: [max_source_bytes, max_output_bytes, max_fetch_bytes, max_ranges, max_range_ms, max_job_ms]
                    properties:
                      max_source_bytes: {type: integer, minimum: 1}
                      max_output_bytes: {type: integer, minimum: 1, description: Maximum bytes in one exported file}
                      max_fetch_bytes: {type: integer, minimum: 1, description: Aggregate remote media transfer budget for one export job}
                      max_ranges: {type: integer, minimum: 1, maximum: 128}
                      max_range_ms: {type: integer, minimum: 1}
                      max_job_ms: {type: integer, minimum: 1}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/sources:
    get:
      description: The session owner's newest sources, at most 20. Empty sessions return an empty array.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200':
          description: Owner source list
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    maxItems: 20
                    items: {$ref: '#/components/schemas/Source'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: JSON body reads are limited to ten seconds or an earlier request deadline; stalled requests return 408 request_timeout. Final source registration can already have committed when a timeout or connection failure is reported; check the same session's source list before deciding to repeat the import. Source imports have no idempotency-key guarantee.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url:
                  type: string
                  x-maxBytes: 8192
                  description: Maximum 8192 UTF-8 bytes, both before and after URL normalization. Public HTTPS media URL or recognized platform recording/clip link. Known platform hosts accept HTTP/schemeless pastes and normalize to HTTPS before fetching. YouTube watch, short-link, Shorts, recorded-live and embed URLs become a canonical watch link; access-essential parameters for other platforms are preserved. Actual live and collection links are rejected.
                  examples: ['https://www.youtube.com/watch?v=aqz-KE-bpKQ', 'youtu.be/aqz-KE-bpKQ', 'https://cdn.example.com/interview.mp4']
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '201': {$ref: '#/components/responses/Source'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/uploads:
    post:
      description: Uploads one file within the configured UPLOAD_TIMEOUT, including quota admission, multipart body transfer and media inspection. Timeout returns 504 source_timeout; final source registration can already have committed despite this response, so check the same session's source list before deciding to repeat the upload. Uploads have no idempotency-key guarantee. Interrupted uploads return 400 invalid_upload; oversize uploads return 413 source_too_large.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '201': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    delete:
      description: Deletes the owner source, its terminal jobs and all outputs. Active queued/running/waiting_storage exports return 409 source_in_use. Physical deletion is retryable and remains charged until successful; clients must confirm destructive intent.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '204': {description: Source and associated terminal resources removed}
        '409': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
    get:
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {$ref: '#/components/responses/Source'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/tracks:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Returns 410 source_removed after automatic media cleanup. Fresh owner-protected track inspection for a staged local upload/direct source. Audio indices are absolute source stream indices. Platform sources without a staged file return tracks_unavailable; their deterministic default audio or no-audio export remains available.
      responses:
        '200':
          description: Available source tracks
          content:
            application/json:
              schema:
                type: object
                required: [tracks]
                properties:
                  display_width: {type: integer, minimum: 2, description: Upright square-pixel display width from fresh inspection; omitted for unsupported geometry or audio-only sources.}
                  display_height: {type: integer, minimum: 2, description: Upright square-pixel display height from fresh inspection; omitted for unsupported geometry or audio-only sources.}
                  tracks:
                    type: array
                    items: {$ref: '#/components/schemas/Track'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/media:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Returns 410 source_removed after automatic media cleanup. Original staged bytes; requires owner session. Range supported. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {description: Media bytes}
        '206': {description: Requested byte range}
        '304': {description: Authorized preview is unchanged; use the privately cached bytes}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/preview:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected H.264/AAC MP4 interval, up to 30 seconds and 16 MiB. Optional 6000 ms windows reduce cold foreground latency; their alignment and cache identity are separate from ordinary 30000 ms windows. Short foreground requests briefly wait for occupied inspection capacity under the same admission limits. Works for accessible platform recordings and staged files with browser-incompatible codecs. Original source time and fresh upright square-pixel source display dimensions are supplied in response headers, including cache hits and conditional/range responses. Display dimensions describe the original before preview scaling, suitable for normalized crop presets. Aligned windows are retained in a private owner-protected cache for up to 30 idle minutes (512 MiB globally, 128 MiB per owner). Responses remain no-store. Rendering pins the source and uses a bounded reservation; completed cache entries do not pin sources. Duplicate interval requests coalesce.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: window_ms
          schema: {type: integer, enum: [6000, 30000], default: 30000}
          description: Video window length and alignment; omission preserves the ordinary 30-second contract.
        - in: query
          name: priority
          schema: {type: string, default: foreground, examples: [foreground, background]}
          description: background prefetch yields rendering capacity to foreground requests; omission or any other value uses foreground priority.
        - in: query
          name: audio_track
          schema: {type: integer, minimum: 0}
          description: Absolute inspected audio stream index for a staged local source. Its selection is included in the private preview cache identity.
        - in: query
          name: no_audio
          schema: {type: boolean}
          description: true renders silent video; cannot be combined with audio_track. Omission selects default audio, otherwise the first audio stream.
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200':
          description: Preview interval
          headers:
            X-Source-Display-Width: {description: Original upright square-pixel width before preview scaling, schema: {type: integer, minimum: 2}}
            X-Source-Display-Height: {description: Original upright square-pixel height before preview scaling, schema: {type: integer, minimum: 2}}
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
          content:
            video/mp4:
              schema: {type: string, format: binary}
        '206': {description: Requested preview byte range, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '304': {description: Authorized preview is unchanged; empty response body, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '412': {description: A request precondition failed; empty response body, headers: {X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}, X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}, X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}}}
        '416':
          description: Malformed or unsatisfiable preview Range; plain text
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
            Content-Range: {schema: {type: string, pattern: '^bytes \*/[0-9]+$'}}
          content:
            text/plain:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/storyboard:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected JPEG search strip for the aligned 30-second source interval. Six fixed 160x90 cells sample source time at start_ms plus 0, 5, 10, 15, 20 and 25 seconds. X-Storyboard-Frames identifies used cells; unused cells near source end are black. Video aspect ratio is preserved within each cell. No audio is prepared. The operation always uses background admission in the shared preview pool and returns server_busy when another renderer is active. It shares private preview cache size/count/expiry limits and source deletion. Preparation is canceled when the request ends; completed bytes remain no-store.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: priority
          schema: {type: string, examples: [background]}
          description: Accepted for consistency with preview clients; storyboards always use background admission.
      responses:
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '200':
          description: 960x90 JPEG sprite, at most 256 KiB
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
            X-Storyboard-Step-MS:
              x-required: true
              schema: {type: integer, const: 5000}
            X-Storyboard-Frames:
              x-required: true
              schema: {type: integer, minimum: 1, maximum: 6}
          content:
            image/jpeg:
              schema: {type: string, format: binary}
        '206': {description: Requested storyboard byte range}
        '304': {description: Authorized storyboard is unchanged; empty response body}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/waveform:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected peaks for an aligned 30-second source window. One absolute peak per 100 ms across every channel of the selected audio track; silent sources return zero peaks with has_audio false. Source timestamps remain global when a remote interval is staged. Always background admission in the shared preview pool, with the same bounded private cache, cancellation and cleanup. No whole-recording decode is started. Removed originals return 410 source_removed.
      parameters:
        - in: query
          name: start_ms
          required: true
          schema: {type: integer, minimum: 0}
        - in: query
          name: audio_track
          schema: {type: integer, minimum: 0}
          description: Absolute audio stream index for staged local media; omission uses default audio, otherwise the first audio stream.
        - in: query
          name: no_audio
          schema: {type: boolean}
          description: true returns silence; cannot be combined with audio_track.
        - in: query
          name: priority
          schema: {type: string, examples: [background]}
          description: Accepted for consistency; waveforms always use background admission.
      responses:
        '200':
          description: Bounded JSON waveform, less than 64 KiB; private no-store response
          headers:
            X-Preview-Cache: {$ref: '#/components/headers/PreviewCache'}
            X-Preview-Start-MS: {$ref: '#/components/headers/PreviewStart'}
            X-Preview-End-MS: {$ref: '#/components/headers/PreviewEnd'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Waveform'}
        '206': {description: Requested waveform byte range}
        '304': {description: Authorized waveform is unchanged; empty body}
        '410': {$ref: '#/components/responses/Error'}
        '412': {description: Failed precondition; empty body}
        '416': {$ref: '#/components/responses/RangeError'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/sources/{id}/thumbnail:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-protected, bounded and inspected PNG/JPEG thumbnail. Raw CDN URLs are never returned to clients. Private conditional caching with ETag requires owner and file revalidation on every request.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {description: Thumbnail image}
        '206': {description: Requested byte range}
        '304': {description: Authorized thumbnail is unchanged; use the privately cached image}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs:
    get:
      description: Up to 30 owner-only exports, active jobs first and newest first within each group. Contains only retained files with private download URLs.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200':
          description: Export history
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    maxItems: 30
                    items: {$ref: '#/components/schemas/JobSummary'}
        default: {$ref: '#/components/responses/Error'}
    post:
      description: JSON body reads are limited to ten seconds; stalled requests return 408 request_timeout.
      parameters:
        - in: header
          name: Idempotency-Key
          schema: {type: string, x-maxBytes: 128}
          description: Maximum 128 UTF-8 bytes. Reusing the key for this session returns the retained original job before current source/admission limits or the per-owner new-export allowance, even if the body changes; use a fresh key for different work. Session, origin, JSON/key bounds and ordinary IP/session request guards still apply. Once retention cleanup or source deletion removes the original job, its key no longer recovers it. A failed mutation can already have committed, including database_unavailable or an earlier request timeout; recover this submission with the same key rather than a new key.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '202': {$ref: '#/components/responses/Job'}
        '408': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/preflight:
    post:
      description: Checks an export request without creating a job, downloading remote media, or reserving export outputs. Local media uses bounded owner-protected inspection and temporary reader leases. Remote sources receive metadata-only validation with explicitly deferred media, track, geometry and tool checks. Valid means the reported prerequisites passed; decoding, encoding, container compatibility, output size, queue/storage admission and publication can still fail during execution. A later export independently rechecks the source. No Idempotency-Key is consumed or recovered. Strict JSON body reads are limited to 1 MiB and ten seconds; source inspection uses the configured SOURCE_TIMEOUT. The endpoint shares ordinary session, origin and request guards and allows at most 30 job inspections per session per minute independently of new-export allowance.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '200':
          description: Known prerequisites passed, with deferred execution checks
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreflightResult'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '408': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '422':
          description: Local media prerequisites or configured tool capabilities are unavailable, including unsupported_media, audio_missing, audio_track_unavailable, copy_quality_unsupported, subtitle_unsupported, encoder_unavailable, filter_unavailable, muxer_unavailable, demuxer_unavailable, bitstream_filter_unavailable or tool_unavailable
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/Error'}
        '503':
          description: Bounded database or inspection admission failure, including database_unavailable, storage_initializing or server_busy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '504': {$ref: '#/components/responses/Error'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/collections/validate:
    post:
      description: Validates selected clips from a versioned single-source plan without encoding or creating jobs. Each clip joins its intervals in submitted order with its own inherited/overridden settings. Selected intervals and total duration share the existing MAX_RANGES/MAX_JOB_MS budgets. Unselected clip IDs, labels and structural bounds are checked; their media edits can remain unfinished. Local clips receive fresh protected media/tool preflight; remote clips receive metadata-only reports with explicit deferred checks. Requires the same owner session, same-origin guard, 1 MiB strict JSON body and ten-second body timeout as jobs. The whole local collection shares SOURCE_TIMEOUT and one inspection/reader admission. Shares the 30 preflight requests per session per minute allowance with job preflight. No idempotency key is consumed.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionRequest'}
      responses:
        '200':
          description: Known selected-clip prerequisites passed; execution checks remain deferred
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionValidation'}
        default:
          description: Collection validation failed; clip_id and field identify known plan/media blockers when available
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionError'}
  /api/v1/collections:
    post:
      description: Adapts selected collection clips to ordinary joined jobs in the existing queue. Requires a workflow Idempotency-Key; per-clip identities include that key, clip ID/label and the normalized effective request, including rendition. Retry the same plan/key to recover retained jobs and admit pending clips after capacity is available. Editing one clip creates new work only for that clip; other retained jobs stay available. A fresh key intentionally starts new work. Collection admission is incremental and preserves the existing three active jobs per owner, global queue, storage and ten new-export attempts per session per minute limits; a 15-clip plan can require several retries as jobs finish. Retained jobs recover before current source-duration, source-media, operator-budget, inspection and export allowance checks. Source ownership, strict JSON, supported plan shape/options and unique selection remain enforced. Only newly pending clips are validated against the actual source and aggregate current budgets; identity-only normalization never authorizes fresh work. Already retained jobs remain in a partial response when pending validation fails. Local pending clips share one fresh preflight admission and SOURCE_TIMEOUT before any new jobs are created; remote media is inspected by the worker. A response containing any retained/admitted job is 202 even if other clips have errors. complete describes admission only, never completed encoding. Poll/cancel/download each job using the existing owner-protected endpoints. Non-admitted retryable clips should be retried with the same workflow key and plan; uncertain database commits are recovered by the same per-clip keys. A terminal failed/cancelled job is still retained and recovered; use a fresh workflow key to intentionally rerun it. No collection database/project is created.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, x-maxBytes: 128}
          description: A nonblank workflow key, maximum 128 UTF-8 bytes. Stable across retries and edits to this collection; unlike POST jobs, edited effective clip requests receive new per-clip jobs. Retention limits recovery.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectionRequest'}
      responses:
        '202':
          description: At least one clip job is retained/admitted; inspect complete and every clip error before retrying pending work
          headers:
            Retry-After:
              description: Present when pending clips hit rate or queue limits; wait this many seconds before retrying
              schema: {type: integer, minimum: 1}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionSubmission'}
        default:
          description: Request guard error, or a collection submission report with no admitted jobs (400 plan, 404 source, 410 removed media, 413 storage budget, 422 media, 429 admission, 503 database/inspection or 504 inspection timeout)
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/CollectionError'}
                  - {$ref: '#/components/schemas/CollectionSubmission'}
  /api/v1/jobs/{id}:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/download.zip:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Streams ready artifacts as an owner-protected ZIP without recompression or a retained archive. Defaults to this job's ready files in item order. Optional artifact_id values include earlier partial-retry successes from the same owner and source, in requested order. All files are checked and opened before streaming; expired or foreign files return an error. Ordered numeric filename prefixes handle duplicate names. An interrupted ZIP must be downloaded again; byte ranges are not supported.
      parameters:
        - in: query
          name: artifact_id
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 128
            uniqueItems: true
            items: {type: string, minLength: 1, maxLength: 160}
      responses:
        '200':
          description: ZIP of ready files
          content:
            application/zip:
              schema: {type: string, format: binary}
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/jobs/{id}/cancel:
    parameters: [{$ref: '#/components/parameters/ID'}]
    post:
      description: Queued and waiting_storage cancellation is immediate; running cancellation settles asynchronously.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {$ref: '#/components/responses/Job'}
        default: {$ref: '#/components/responses/Error'}
  /api/v1/artifacts/{id}/download:
    parameters: [{$ref: '#/components/parameters/ID'}]
    get:
      description: Owner-authorized attachment. Range supported.
      responses:
        '503': {$ref: '#/components/responses/DatabaseUnavailable'}
        '200': {description: Exported file}
        '206': {description: Requested byte range}
        '304': {description: Authorized file is unchanged; empty response body}
        '412': {description: A request precondition failed; empty response body}
        '416': {$ref: '#/components/responses/RangeError'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: cutmy_session
  headers:
    PreviewCache:
      x-required: true
      schema: {type: string, enum: [hit, miss]}
    PreviewStart:
      x-required: true
      schema: {type: integer}
    PreviewEnd:
      x-required: true
      schema: {type: integer}
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema: {type: string}
  responses:
    RangeError:
      description: Malformed or unsatisfiable Range. Plain text comes from HTTP byte-range serving; clients must not parse it as the JSON error envelope.
      headers:
        Content-Range:
          description: Included for unsatisfiable ranges as bytes */size; malformed ranges may omit it.
          schema: {type: string, pattern: '^bytes \*/[0-9]+$'}
      content:
        text/plain:
          schema: {type: string}
    DatabaseUnavailable:
      description: A bounded database operation failed or exceeded its budget. Mutations may already have committed; the same uncertainty can accompany an earlier 408 request_timeout or 504 source_timeout. Recover retained job submissions with the same Idempotency-Key. Check the same session's source list before deciding to repeat an uncertain upload/import; these operations have no idempotency-key guarantee. No blanket retry guarantee is given for other mutations.
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - type: object
                properties:
                  error:
                    properties:
                      code: {const: database_unavailable}
    StorageUnavailable:
      description: A bounded database failure or incomplete initial storage accounting. storage_initializing rejects admission before media preparation; Retry-After gives seconds before another attempt. database_unavailable retains its uncertain-mutation guidance.
      headers:
        Retry-After:
          description: Present for storage_initializing; seconds before retrying the rejected admission.
          schema: {type: string, pattern: '^[0-9]+$'}
      content:
        application/json:
          schema:
            allOf:
              - {$ref: '#/components/schemas/Error'}
              - type: object
                properties:
                  error:
                    properties:
                      code: {enum: [database_unavailable, storage_initializing]}
    Error:
      description: Structured error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Source:
      description: Prepared source
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Source'}
    Job:
      description: Export job
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Job'}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    Source:
      type: object
      required: [id, title, duration_ms, kind, provider, provider_video_id, source_url, preview_kind, preview_url, embed_url, thumbnail_url, expires_at, retention_blocked]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: 'RFC3339 source retention target, or null while linked jobs pin the source.'}
        retention_blocked: {type: boolean, description: A retained job currently pins this source.}
        media_removed: {type: boolean, default: false, description: Original media was removed after successful export. Metadata and results remain retained; reopen the recording to continue editing.}
        title: {type: string}
        duration_ms: {type: integer, minimum: 1}
        kind: {type: string, enum: [upload, direct, youtube, platform]}
        provider:
          type: string
          enum: [upload, direct, generic, youtube, twitch, rutube, tiktok, instagram, vimeo, dailymotion, vk, facebook, x, reddit, ok, bilibili, streamable, rumble]
          description: Recognized extractor family; a provider name is not a guarantee of link availability.
        provider_video_id: {type: [string, 'null']}
        source_url:
          type: [string, 'null']
          description: HTTPS platform page URL; null for uploads and direct files. Never an extracted CDN media address.
        preview_kind: {type: string, enum: [native, youtube, window, none]}
        preview_url: {type: [string, 'null']}
        embed_url: {type: [string, 'null']}
        thumbnail_url:
          type: [string, 'null']
          description: Relative owner-protected thumbnail endpoint, or null. Never a raw external image URL.
        width:
          type: integer
          description: Coded width of the selected playable video for local files; omitted for audio-only files. Platform sources use provider format metadata. Persisted source responses do not expose fresh SDK/CLI display dimensions.
        height:
          type: integer
          description: Coded height of the selected playable video for local files, before sample-aspect-ratio/display-rotation normalization; omitted for audio-only files.
        tracks:
          type: array
          items: {$ref: '#/components/schemas/Track'}
          description: Optional fresh stream inspection; use the tracks endpoint for retained sources.
    Track:
      type: object
      required: [index, type, codec, default]
      properties:
        index: {type: integer, minimum: 0}
        type: {type: string}
        codec: {type: string}
        language: {type: string}
        title: {type: string}
        channels: {type: integer}
        sample_rate: {type: string}
        attached_picture: {type: boolean}
        default: {type: boolean}
    TrackSelection:
      type: object
      required: [index, type, codec, default, included, reason]
      properties:
        index: {type: integer, minimum: 0}
        type: {type: string}
        codec: {type: string}
        language: {type: string}
        title: {type: string}
        channels: {type: integer}
        sample_rate: {type: string}
        attached_picture: {type: boolean}
        default: {type: boolean}
        included: {type: boolean}
        reason: {type: string, description: Explanation of the stream selection; unknown future values are permitted.}
    ArtifactSegment:
      type: object
      required: [index, label, source_start_ms, source_end_ms, output_start_ms, output_end_ms]
      properties:
        index: {type: integer}
        label: {type: string}
        source_start_ms: {type: integer}
        source_end_ms: {type: integer}
        output_start_ms: {type: integer}
        output_end_ms: {type: integer}
    Range:
      type: object
      additionalProperties: false
      required: [start_ms, end_ms]
      properties:
        start_ms: {type: integer, minimum: 0}
        end_ms: {type: integer, minimum: 1}
        label: {type: string, x-maxBytes: 200, x-trimSpace: true, description: Optional label; maximum 200 UTF-8 bytes after trimming Unicode whitespace}
    Waveform:
      type: object
      required: [start_ms, end_ms, step_ms, has_audio, peaks]
      properties:
        start_ms: {type: integer, minimum: 0, description: Aligned source timeline start}
        end_ms: {type: integer, minimum: 1, description: Source end or start plus 30000 ms}
        step_ms: {type: integer, const: 100}
        has_audio: {type: boolean}
        audio_track: {type: integer, minimum: 0}
        peaks:
          type: array
          maxItems: 300
          items: {type: number, minimum: 0, maximum: 1}
    Crop:
      type: object
      additionalProperties: false
      required: [x, y, width, height]
      description: Normalized rectangle in the upright square-pixel displayed image. Requires accurate MP4. Both opposite edges must remain inside the image; dimensions must resolve to at least two displayed pixels. Each edge rounds to the nearest even pixel boundary within the image by at most one displayed pixel, before the normal resolution cap.
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        width: {type: number, exclusiveMinimum: 0, maximum: 1}
        height: {type: number, exclusiveMinimum: 0, maximum: 1}
    ExportRequest:
      type: object
      additionalProperties: false
      required: [source_id, ranges, format, quality, cut_mode]
      properties:
        source_id: {type: string}
        cleanup_source: {type: boolean, default: false, description: Remove original media and preview assets after full success and accepted operations settle. Projects and finished artifacts remain available. Omission preserves legacy retention. Concurrent failure or cancellation preserves the source.}
        ranges:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/Range'}
        format: {type: string, enum: [mp4, mp3, mkv], description: MKV requires copy; MP3 requires accurate.}
        quality: {type: string, enum: [1080p, 720p, best]}
        cut_mode: {type: string, enum: [accurate, copy], description: MP3 requires accurate. Copy preserves source resolution; select best for original quality. A lower explicit cap fails with copy_quality_unsupported instead of silently resizing or exceeding the cap.}
        output_mode: {type: string, enum: [separate, joined], default: separate, description: Separate publishes each range independently. Joined publishes one artifact in submitted range order; its actual bounds describe the output timeline and segments describe each source interval.}
        audio_track: {type: integer, minimum: 0, description: Absolute inspected audio stream index for staged local media. Omission uses first default audio, otherwise first audio.}
        no_audio: {type: boolean, default: false, description: Export video without audio; cannot be combined with audio_track or MP3.}
        subtitle_mode: {type: string, enum: [omit, preserve], default: omit, description: Preserve compatible plain text subtitles from local copy sources, clipped and rebased to actual boundaries. Unsupported subtitle codecs fail explicitly. MP4 writes mov_text; MKV writes subrip.}
        crop: {$ref: '#/components/schemas/Crop'}
        rendition: {type: string, enum: [final, draft], default: final, description: Draft requires accurate MP4 and uses a 720p cap plus ultrafast CRF28 encoding. Omitted/final retains installed final encoder settings. Persisted normalized final requests omit this field.}
    CollectionRequest:
      type: object
      additionalProperties: false
      required: [source_id, plan]
      properties:
        source_id: {type: string, description: Source accessible to the current session. HTTP collection plans cannot open local filesystem paths.}
        plan: {$ref: '#/components/schemas/CollectionPlan'}
        clip_ids:
          type: array
          maxItems: 128
          uniqueItems: true
          items: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$'}
          description: Selected IDs, returned in plan order. Empty/omitted selects every clip. Unknown or duplicate IDs fail explicitly.
        rendition: {type: string, enum: [final, draft], default: final, description: Draft requires accurate MP4, retains edits/crop/audio choices and uses a 720p cap plus ultrafast CRF28 encoding. Final uses requested quality and installed final encoder settings.}
    CollectionPlan:
      type: object
      additionalProperties: false
      required: [version, clips]
      properties:
        version: {type: integer, const: 1}
        input: {type: string, const: '', description: Local engine plans may contain input; HTTP requires this field to be absent or empty and uses source_id.}
        options: {$ref: '#/components/schemas/CollectionOptions'}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/CollectionClip'}
    CollectionClip:
      type: object
      additionalProperties: false
      required: [id, ranges]
      properties:
        id: {type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$', description: Stable unique clip identity within this plan.}
        label: {type: string, x-maxBytes: 200, description: Optional human label; whitespace is trimmed for normalized output.}
        ranges:
          type: array
          minItems: 1
          maxItems: 128
          items: {$ref: '#/components/schemas/Range'}
          description: Source intervals joined in this order, including repeated or overlapping intervals. Selected intervals share aggregate server budgets.
        options: {$ref: '#/components/schemas/CollectionOptions'}
    CollectionOptions:
      type: object
      additionalProperties: false
      description: Clip options override collection options. Empty strings and omitted/null pointers inherit. Defaults are MP4, best, accurate, automatic audio and omitted subtitles. Explicit no_audio false enables inherited audio; audio_track -1 resets inherited selection to automatic. clear_crop removes inherited crop; crop and clear_crop together fail. Settings must be compatible after inheritance.
      properties:
        format: {type: string, enum: ['', mp4, mp3, mkv]}
        quality: {type: string, enum: ['', best, 1080p, 720p]}
        cut_mode: {type: string, enum: ['', accurate, copy]}
        subtitle_mode: {type: string, enum: ['', omit, preserve]}
        audio_track: {type: [integer, 'null'], minimum: -1}
        no_audio: {type: [boolean, 'null']}
        crop:
          oneOf:
            - {$ref: '#/components/schemas/Crop'}
            - {type: 'null'}
        clear_crop: {type: boolean}
    CollectionDiagnostic:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: Open public diagnostic vocabulary; accept future codes.}
        message: {type: string, description: Safe human diagnostic without server paths or raw subprocess/database output.}
        clip_id: {type: string, description: Clip responsible for this error, when identifiable. A shared inspection blocker can prevent admission of other pending clips.}
        field: {type: string, description: JSON-style field path within the clip or top-level plan/selection.}
    CollectionError:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/CollectionDiagnostic'}
    CollectionValidation:
      type: object
      required: [version, valid, rendition, requested_duration_ms, clips]
      properties:
        version: {type: integer, const: 1}
        valid: {type: boolean, const: true}
        rendition: {type: string, enum: [final, draft]}
        requested_duration_ms: {type: integer, minimum: 1}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [clip_id, label, preflight]
            properties:
              clip_id: {type: string}
              label: {type: string}
              preflight: {$ref: '#/components/schemas/PreflightResult'}
    CollectionSubmission:
      type: object
      required: [version, rendition, complete, clips]
      properties:
        version: {type: integer, const: 1}
        rendition: {type: string, enum: [final, draft]}
        complete: {type: boolean, description: All selected clips have retained/admitted jobs. Jobs can still be running, failed or cancelled.}
        clips:
          type: array
          minItems: 1
          maxItems: 128
          items:
            type: object
            required: [clip_id, label, requested_duration_ms, request, retryable]
            oneOf:
              - required: [job]
              - required: [error]
            properties:
              clip_id: {type: string}
              label: {type: string}
              requested_duration_ms: {type: integer, minimum: 1}
              request: {$ref: '#/components/schemas/ExportRequest'}
              job: {$ref: '#/components/schemas/Job'}
              error: {$ref: '#/components/schemas/CollectionDiagnostic'}
              retryable: {type: boolean, description: Pending work can be retried with the same plan/workflow key after the stated condition changes. Recovered jobs use false.}
    PreflightResult:
      type: object
      required: [version, valid, source, request, requested_duration_ms, output_count, track_manifest, checks, warnings]
      description: A read-only prerequisite report. Known blockers return an error response instead. Deferred checks are not proof of export success; execution does its own validation and admission. No local server paths, extracted media URLs or tool diagnostics are exposed.
      properties:
        version: {type: integer, const: 1}
        valid: {type: boolean, const: true}
        source: {$ref: '#/components/schemas/PreflightSource'}
        request: {$ref: '#/components/schemas/ExportRequest'}
        requested_duration_ms: {type: integer, minimum: 1, description: Sum of requested intervals in submitted order; overlapping or repeated intervals each contribute. Copy boundaries can change actual duration.}
        output_count: {type: integer, minimum: 1, description: One for joined export; otherwise one per requested interval.}
        track_manifest:
          type: array
          items: {$ref: '#/components/schemas/TrackSelection'}
          description: Deterministic inspected stream selection for local media; empty for remote metadata-only checks.
        video: {$ref: '#/components/schemas/PreflightVideo'}
        checks:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/PreflightCheck'}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/PreflightWarning'}
    PreflightSource:
      type: object
      required: [duration_ms]
      properties:
        duration_ms: {type: integer, minimum: 1}
        width: {type: integer, minimum: 1, description: Coded selected video width, omitted for audio-only sources.}
        height: {type: integer, minimum: 1, description: Coded selected video height, omitted for audio-only sources.}
        display_width: {type: integer, minimum: 1, description: Fresh local upright square-pixel display width when supported; omitted for remote or audio-only sources.}
        display_height: {type: integer, minimum: 1, description: Fresh local upright square-pixel display height when supported; omitted for remote or audio-only sources.}
    PreflightVideo:
      type: object
      required: [width, height, hdr_to_sdr]
      properties:
        width: {type: integer, minimum: 1, description: Requested rendered video width; copy retains source dimensions.}
        height: {type: integer, minimum: 1, description: Requested rendered video height; copy retains source dimensions.}
        hdr_to_sdr: {type: boolean, description: Accurate rendering requests HDR-to-SDR conversion.}
    PreflightCheck:
      type: object
      required: [name, status]
      properties:
        name: {type: string, description: Prerequisite identifier; clients must accept future names.}
        status: {type: string, enum: [passed, deferred]}
    PreflightWarning:
      type: object
      required: [code, message]
      properties:
        code: {type: string, description: Machine-readable warning; clients must accept future codes.}
        message: {type: string, description: Human diagnostic which may change.}
    Artifact:
      type: object
      required: [id, filename, size_bytes, download_url, actual_start_ms, actual_end_ms, expires_at]
      properties:
        id: {type: string}
        expires_at: {type: [string, 'null'], format: date-time, description: 'Immutable result retention deadline, or null while an active job pins the result.'}
        filename: {type: string}
        size_bytes: {type: integer}
        download_url: {type: string}
        actual_start_ms: {type: integer}
        actual_end_ms: {type: integer}
        segments:
          type: array
          items: {$ref: '#/components/schemas/ArtifactSegment'}
        track_manifest:
          type: array
          items: {$ref: '#/components/schemas/TrackSelection'}
    JobItem:
      type: object
      required: [id, label, start_ms, end_ms, status, artifact]
      properties:
        id: {type: string}
        label: {type: string}
        start_ms: {type: integer}
        end_ms: {type: integer}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress_ms:
          type: integer
          minimum: 0
          description: Optional processed media time from FFmpeg, in milliseconds. Omitted before progress is available and in legacy jobs. Encoding can finish before file validation/publication; only succeeded status makes an artifact ready. A cached-address refresh may reset progress.
        message: {type: string}
        error_code:
          type: string
          description: Optional fixed public diagnostic on failed/cancelled items. Legacy items can omit it. Localize known codes and use a safe generic fallback for unknown ones; never display raw subprocess output.
          examples: [audio_missing, hdr_conversion_unavailable, output_limit, platform_access_required, platform_unavailable, unsupported_stream, live_not_supported, unsupported_collection, media_upstream_denied, media_upstream_unavailable, media_network_timeout, media_network_reset, copy_incompatible, copy_quality_unsupported, media_processing_failed, source_expired, source_changed, source_timeline_changed, source_timeout, job_timeout, storage_full, storage_timeout, storage_limit, server_error, cancelled]
        artifact:
          oneOf:
            - {$ref: '#/components/schemas/Artifact'}
            - {type: 'null'}
    JobSummary:
      type: object
      required: [id, source_id, title, status, stage, created_at, total, files]
      properties:
        id: {type: string}
        source_id: {type: string}
        title: {type: string}
        status: {type: string, enum: [queued, running, waiting_storage, succeeded, failed, cancelled]}
        stage: {type: string}
        created_at: {type: string, format: date-time}
        total: {type: integer}
        files:
          type: array
          items: {$ref: '#/components/schemas/Artifact'}
    Job:
      type: object
      required: [id, status, stage, message, items, storage_wait_until]
      properties:
        id: {type: string}
        status: {type: string, enum: [queued, running, waiting_storage, succeeded, failed, cancelled]}
        storage_wait_until: {type: [string, 'null'], format: date-time, description: Finite persisted storage wait deadline; null before the first storage wait.}
        stage: {type: string}
        message: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/JobItem'}
