        '200':
          description: Thumbnail image
        '206':
          description: Requested byte range
        '304':
          description: Authorized thumbnail is unchanged; use the privately cached image
        '412':
          description: A request precondition failed; empty response body
        '416':
          $ref: '#/components/responses/RangeError'
        default:
          $ref: '#/components/responses/Error'
