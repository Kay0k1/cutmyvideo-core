name: Feature request
description: Propose a concrete improvement to the reusable engine
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Who needs this behavior, and what currently prevents it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed result
      description: Explain the expected input/output and relevant source or resource limits.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
