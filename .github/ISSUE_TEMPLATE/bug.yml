name: Bug report
description: Report a reproducible problem in the media engine
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: Commit or release tag
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Source type, requested ranges, settings, and sanitized errors. Do not include private URLs or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
