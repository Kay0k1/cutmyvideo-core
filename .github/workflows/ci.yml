name: Core checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        required: false
        default: ''
        type: string
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: cutmy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cutmy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cutmy -d cutmy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cutmy:test-only-password@localhost:5432/cutmy_test?sslmode=disable
      CUTMY_TEST_YTDLP: /tmp/cutmy-yt-dlp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg python3
      - name: Install pinned extractor for offline metadata regressions
        run: |
          curl --fail --show-error --location --proto '=https' --tlsv1.2 https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp -o /tmp/cutmy-yt-dlp
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  /tmp/cutmy-yt-dlp' | sha256sum --check
          chmod 755 /tmp/cutmy-yt-dlp
      - name: Full checks (media, PostgreSQL, docs, workflows, race and vulnerabilities)
        run: make check-full
      - name: CLI help and build information
        run: |
          bin/cutmy --help
          bin/cutmy clip --help
          bin/cutmy inspect --help
          bin/cutmy version
