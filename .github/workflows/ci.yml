name: Core checks

on:
  push:
    branches: [main]
  # PR checks run once through release.yml, using its immutable source commit.
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to check
        required: false
        default: ''
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep the reusable call distinct from its caller's concurrency group.
  group: core-checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  sdk:
    name: Installed SDKs (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    env:
      GOTOOLCHAIN: local
      CUTMY_REQUIRE_DURABLE_FS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.0'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
      - name: Linux media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: |
          media_formula=ffmpeg-full
          if [ "$RUNNER_ARCH" = X64 ]; then media_formula=ffmpeg@7; fi
          brew install "$media_formula"
          echo "$(brew --prefix "$media_formula")/bin" >> "$GITHUB_PATH"
      - name: Windows pinned media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'sdk-ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-10-13-04/ffmpeg-n8.1.3-17-gc389840894-win64-gpl-8.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2a7921874ac122ba731c181c2f235542ab9de790a67c08ec58fe0b54ff763647') { throw 'FFmpeg checksum mismatch' }
          $media = Join-Path $env:RUNNER_TEMP 'cutmy-sdk-media'
          Expand-Archive $archive -DestinationPath $media
          (Get-ChildItem $media -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - name: Package, install and exercise Python and TypeScript SDKs
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-sdk-build.txt
          python -m unittest discover -s scripts -p sdk_checks_test.py
          python scripts/check-sdks.py --output "$RUNNER_TEMP/sdk-evidence"
      - name: Retain installed package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-evidence
          if-no-files-found: error
          retention-days: 3
  sdk-http:
    name: Installed SDK HTTP and worker acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_USER: cutmy
          POSTGRES_PASSWORD: sdk-test-only
          POSTGRES_DB: cutmy_sdk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cutmy -d cutmy_sdk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cutmy:sdk-test-only@127.0.0.1:5432/cutmy_sdk?sslmode=disable
      GOTOOLCHAIN: local
      CUTMY_REQUIRE_DURABLE_FS: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Installed consumers against actual API, worker and media
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r scripts/requirements-sdk-build.txt
          python scripts/check-sdks.py --http --output "$RUNNER_TEMP/sdk-http-evidence"
      - name: Retain HTTP consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdk-http-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-http-evidence
          if-no-files-found: error
          retention-days: 3
  artifact-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - run: python3 scripts/check-artifacts.py
  native:
    name: Native media (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    env:
      GOTOOLCHAIN: local
      CUTMY_REQUIRE_DURABLE_FS: '1'
      CUTMY_REQUIRE_NATIVE_SERVICE: '1'
      TEST_DATABASE_URL: postgres://cutmy:native-test-only@127.0.0.1:55439/cutmy_native?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Linux media dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg python3
      - name: macOS media dependencies
        if: runner.os == 'macOS'
        run: |
          media_formula=ffmpeg-full
          if [ "$RUNNER_ARCH" = X64 ]; then media_formula=ffmpeg@7; fi
          brew install "$media_formula" postgresql@17
          echo "$(brew --prefix "$media_formula")/bin" >> "$GITHUB_PATH"
      - name: Windows media dependencies (pinned archive and checksum)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-10-13-04/ffmpeg-n8.1.3-17-gc389840894-win64-gpl-8.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2a7921874ac122ba731c181c2f235542ab9de790a67c08ec58fe0b54ff763647') { throw 'FFmpeg checksum mismatch' }
          $media = Join-Path $env:RUNNER_TEMP 'cutmy-media'
          Expand-Archive $archive -DestinationPath $media
          (Get-ChildItem $media -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName >> $env:GITHUB_PATH
      - name: Isolated Linux PostgreSQL
        if: runner.os == 'Linux'
        run: |
          docker run --rm --detach --name cutmy-native-db -e POSTGRES_USER=cutmy -e POSTGRES_PASSWORD=native-test-only -e POSTGRES_DB=cutmy_native -p 127.0.0.1:55439:5432 postgres:17.11-bookworm
          for attempt in $(seq 1 30); do
            if docker exec cutmy-native-db pg_isready -U cutmy -d cutmy_native; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Isolated macOS PostgreSQL
        if: runner.os == 'macOS'
        run: |
          pg_bin="$(brew --prefix postgresql@17)/bin"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/cutmy-pg" -U cutmy -A trust --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/cutmy-pg" -l "$RUNNER_TEMP/cutmy-pg.log" -o '-h 127.0.0.1 -p 55439' -w start
          "$pg_bin/createdb" -h 127.0.0.1 -p 55439 -U cutmy cutmy_native
      - name: Isolated Windows PostgreSQL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP 'cutmy-pg'
          & (Join-Path $env:PGBIN 'initdb.exe') -D $data -U cutmy -A trust --encoding=UTF8
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL initialization failed' }
          & (Join-Path $env:PGBIN 'pg_ctl.exe') -D $data -l (Join-Path $env:RUNNER_TEMP 'cutmy-pg.log') -o '-h 127.0.0.1 -p 55439' -w start
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL startup failed' }
          & (Join-Path $env:PGBIN 'createdb.exe') -h 127.0.0.1 -p 55439 -U cutmy cutmy_native
          if ($LASTEXITCODE -ne 0) { throw 'PostgreSQL database creation failed' }
      - name: Runtime media, publication, errors and process-tree cancellation
        shell: bash
        run: |
          ffmpeg -version | tee ffmpeg-version.txt
          ffprobe -version | tee ffprobe-version.txt
          python_command=python3
          if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
          "$python_command" -m unittest discover -s scripts -p prune_workspace_artifacts_test.py
          "$python_command" -m unittest discover -s scripts -p release_consumer_test.py
          "$python_command" -m unittest discover -s scripts -p release_download_test.py
          "$python_command" -m unittest discover -s scripts -p consumer_process_native_test.py
          "$python_command" scripts/check-media-capabilities.py
          go test -json -race -count=1 -timeout=8m ./pkg/engine ./internal/fsdurable ./cmd/cutmy | tee native-media-tests.jsonl
          go test -json -race -count=1 -timeout=3m ./internal/app -run '^(TestProcess.*|TestDiagnosticCopyCannotBypassMemoryBound)$' | tee native-process-tests.jsonl
          go test -json -race -count=1 -timeout=3m ./internal/app -run '^(TestDraftCache.*|TestStorePool(IdleDefaultsPreserveExplicitDurations|InvalidIdleDurationsRemainParserErrors|IdleRetirementPreservesAcquiredTransaction)|TestSourcePreparations.*|TestSourcePreparationKeyGrammarForPathsAndHeaders|TestSourcePreparationLeaseFencingAndRetainedReceipt|TestAgentProjectPersistenceLimitRecognizesOnlyKnownConstraints|TestHTTPAgentProject(HandoffIsolationEditsAndRepair|ExpiryAndPutMutationAdmission|CreationRecoveryAndConcurrentHandoff|AttachedArtifactsAndRange|ExplicitBindingsPreserveIdenticalClips|ExpandedPlanLimitIsCorrectiveAndAtomic)|TestRetimeSubtitles.*|TestSubtitleRetimePublicHandler.*|TestHTTPCollections(RemoteValidationAndGuards|SubmitRetryAndSelectedEdit|LocalPreflightAndDraft|BatchPreflightRejectsLateClipBeforeAdmission|PartialFailureRecovery|RetainedRecoveryAfterSourceChanges)|TestHTTPPreflight(RemoteMetadataAndGuards|LocalReadOnlyAndAdmissionCleanup|CancellationReleasesLeases)|TestLocalProbeCache.*|TestVerifiedExportAdmissionDoesNotWaitForBusyPreviewPool|TestNativeServiceUploadExportAndDownload|TestSourceMediaCleanup(Keeps.*|Waits.*|Failure.*|Partial.*|Restart.*|Job.*|Migration.*|JSON.*|Recovers.*|Preserves.*)|TestSourceMediaReader.*|TestExpiredSourceMediaReadersPruneInBoundedUnlockedBatches|TestWaveformPrivateCacheAccountingAndDeletion|TestPreviewOriginalDisplayGeometrySurvivesChargedToolFreeCache|TestPreviewMediaPolicyUpgradeDoesNotReuseLegacyCache|TestLocalMediaDimensionsRefresh(FencesLegacyDecoderCapacity|PreservesIdentityAndCancellation|KeepsUnknownInputConservative)|TestHTTPTracksAreFreshOwnerProtectedAndRemoteExplicit|TestSeparateBatchPartialFailureKeepsCompletedDownload|TestJoinedLostPublicationAcknowledgementResumesWithoutRendering|TestWorkerNotificationWakesAfterCommitAndClosesOnCancellation|TestInsertedJobEmitsQueueNotification|TestArchive.*|TestQuickPreviewUsesIndependentAlignedCacheAndWaitsForTrackInspection|TestWorkerSubtitleCacheRemainsChargedUntilFinalUnfinishedPublication|TestLazyThumbnailCancelledBodyRemovesPartialAndReleasesPins|TestLazyThumbnailConcurrentGetsReuseFileAndCommitExactCharge|TestLazyThumbnailDeadlineAndChangedIdentityDoNotFetch|TestLazyThumbnailDisabledQuotaKeepsImageAllowanceBounded|TestLazyThumbnailImportPublishesMetadataWithoutImageWork|TestLazyThumbnailOversizedBodyCannotWriteBeyondAllowance|TestLazyThumbnailOwnerRejectionPerformsNoResolutionOrFetch|TestLazyThumbnailPresentationAcceptsOnlyCanonicalOwnerEndpoint|TestLazyThumbnailRestartAndExpiredMetadataRefresh|TestLazyThumbnailSmallQuotaBoundsActualTransfer|TestLazyThumbnailUncertainAttachmentKeepsCompletedBytes|TestWorkerRepeatedLocalRangesReuseOwnedPublicationWithIndependentFiles|TestWorkerReusesLocalProbeAcrossJobsAndStillVerifiesEachOutput)$' | tee native-service-tests.jsonl
          go test -json -race -count=1 -timeout=4m ./internal/app -run '^(TestStorage(AdmissionChecksFilesystemSpaceIndependentlyOfLogicalCap|AdmissionChecksNearestExistingFilesystem|AdmissionIncludesOutstandingReservationsAndSafetyHeadroom|BootstrapProgressSurvivesRestart|BootstrapAmortizesLegacyExpiryAndResumesAfterCancellation|ScanCanceledBatchDoesNotAdvance|ScanSchedulingBatchFailuresPreserveClocks|ScanPrefixChangeRestartsCoverage|ScanClassesRemainFairAcrossNewWorkAndRestart|ReconcileCoverageGatesExpiredReservations|WorkProgressSurvivesRestartAndUnsafeCandidate|DeletePoisonBatchDoesNotStarveAcrossCyclesAndRestart|DeleteDirectorySyncFailureKeepsChargeUntilDurableRetry|DeleteLockAndCancellationFencePhysicalRemoval|DeleteStaleListCannotRemoveRegisteredReplacement|DeleteSerializesConcurrentReplacementRegistration|DeletePreservesAnotherSourceSharingTheFile|DeleteBackoffIsBoundedAndRetombstonePreservesSchedule|DeleteDuePickerUsesBoundedIndexBeforeFuturePoison|ScanSession.*)|TestMetadataRetention.*|TestMetadataCacheExpiryCorruptionAndFailureFallback|TestSourceRetentionFalsePreviewZerosPreservePinsAndBatchLimit|TestSourcePinAudit(OwnedBudgetKeepsContinuationAndAcknowledgedRepairs|OwnedBudgetPreservesGenuineFailures|ParentCancellationHasPrecedence|UnknownCommitResumesDurableState|BlockedAfterMediaCommitKeepsDrainablePaths|ParentCanceledAfterMediaCommitKeepsDrainablePaths)|TestAgentProjectsRuntimeGrantsPermitCRUDWithoutOwnership|TestAgentProjectsMigrationPreserves007RowsAndRestartsWithoutWrites|TestMigrationsUpgradeMaintenancePredecessorPreservesProgressRetriesAndCache|TestAccurateJoinReservationOnlyIncludesActualProducers|TestAccurateJoinCanBeClaimedWithRoomForItsRealOutput|TestSeparateSubtitleReservationChargesSharedSourceTextOnce|TestCopyExportsRetainDecoderBudgetForCompositeVerification|TestFinalPlatformPublicationKeepsHLSCacheChargedUntilWorkspaceRemoval|TestMetadataResolutionDoesNotRetainPoolConnections|TestMetadataResolutionExpiredAndInvalidatedOwnersCannotPublish|TestMetadataResolutionMigrationPreserves006RowsAndRestartsWithoutWrites|TestPipelineInspectionSharesDecoderBudgetAndLegacyInspectionDoesNotReacquire|TestPlatformHLSCacheReservationIsBoundedSharedAndDisabledOnSmallStores|TestSourceMediaCleanupProtectedPrefixDoesNotHideEligibleRequests|TestWorkerCompactProgressPreservesOtherItemsAndLeaseFencing|TestMetadataResolutionRuntimeGrantsPermitLeaseCRUDWithoutOwnership|TestMetadataResolutionInvalidationWaitsForPublisherAndRemovesFreshCache|TestMetadataResolutionForceFreshInvalidationAndWinnerFence|TestMetadataResolutionForceFreshUnavailableClaimReturnsFreshWithoutCaching)$' | tee native-storage-tests.jsonl
          media_contract_timeout=10m
          # Intel macOS needs more wall time for the same complete native suite.
          if [ "$RUNNER_OS" = macOS ] && [ "$RUNNER_ARCH" = X64 ]; then media_contract_timeout=20m; fi
          go test -json -race -count=1 -timeout="$media_contract_timeout" ./internal/app ./pkg/engine -run '^(TestPreflight(LocalBatch.*|Local.*|Capabilities.*)|TestMediaCrop.*|TestCrop.*|TestWaveform(PCMStreamingBoundsAndSplitSamples|MatchesIndependentAudioTimelineAndOffsets|SelectsActualAudioTrack|PreservesAntiphaseStereoActivity|RetainsAudibleHighFrequencyActivity|SourceRatePreservesClockAndChannelFrameBins)|TestPreviewGeometryIgnoresMalformedMetadataAndEnforcesSize|TestPreviewScalingKeepsExactHeightCapDespiteFloatRounding|TestAdvancedCropPlanPublishesActualCroppedOutput|TestMediaContract(RotationDisplayGeometry|SampleAspectNormalization|VariableFrameTimestamps|HDRToneMappingAndCopy|DefaultAudioSelection|AttachedPicturesAreNotVideo|CopyQualityUsesSelectedVideo)|TestHLSMediaContract(RotationAndSAR|DefaultAudio|HDRTags|ContinuityMetadata|FingerprintUsesSelectedTracks)|TestHDR(CapabilityFailureKeepsProcessCause|FailurePreservesCancellationAndLimits)|TestEngineInspectSeparatesCodedAndDisplayDimensions|TestBatchAudioSelectionSubtitlesAndJoinedTimeline|TestJoinedRemoteEntryKeepsMediaFormatAndProtocolRestrictions|TestJoinedAccurateDiscovery.*|TestJoinedMP3UsesFreshBoundedVerificationAndLargeFallback|TestOwnedMP3.*|TestOwnedMP4.*|TestJoinedMP4.*|TestLocalExportSession.*|TestCopyJoinReusesRepeatedSegmentsAndFaststartOnlyFinal|TestCopyKeyframeSelectionKeepsInitialAndDecodeClocks|TestHLSInitializationCacheHasImmutableMapAndBoundedPinnedEntries|TestHLSJobCacheDisabledForSmallStores|TestHLSPacketAnchorHonorsPreparationDecoderBudget|TestPacketDropCapabilitiesCheckToolIdentityBoundsAndCancellation|TestCopyPacketTrimEligibilityPreservesUnprovenClockPaths|TestHLSJobCacheReusesBytesButKeepsIntervalAndNetworkBudgets|TestLocalKeyframeCacheChecksSourceToolStreamAndCancellation|TestLocalKeyframeLookaheadBoundsFallbackAndCacheLimit|TestParallelHLSAdvancesPastStragglerInsideBoundedWindow|TestSourceSubtitleIndexReusesOnlyOneBoundedTrack|TestSubtitleIndexPreservesSpanningUnsortedRepeatedAndEmptyCues|TestCopyJoinAudioPacketCopyPreservesClocks|TestCopyJoinAudioPreservesFineSourcePacketClocks|TestCopyPacketDropPreservesUnknownPresentationTimestamps|TestCopyJoinAudioFallsBackWhenPacketTrimUnavailable)$' | tee native-media-contract-tests.jsonl
          binary=cutmy-native
          if [ "$RUNNER_OS" = Windows ]; then binary=cutmy-native.exe; fi
          go build -trimpath -o "$binary" ./cmd/cutmy
          "./$binary" version | tee native-version.json
          "./$binary" --json-errors inspect --input absent.mp4 >success.txt 2>error.json && exit 1 || test "$?" -eq 1
          "$python_command" -c 'import json; d=json.load(open("error.json")); assert d["error"]["code"] == "input_not_found"'
          test ! -s success.txt
          "$python_command" scripts/check-native-results.py native-media-tests.jsonl native-process-tests.jsonl native-service-tests.jsonl native-storage-tests.jsonl native-media-contract-tests.jsonl
      - name: Retain native runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-*-tests.jsonl
            native-version.json
            ffmpeg-version.txt
            ffprobe-version.txt
          if-no-files-found: warn
          retention-days: 3
  bookworm-media:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: node:22-bookworm-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: cutmy
          POSTGRES_PASSWORD: bookworm-test-only
          POSTGRES_DB: cutmy_draft_cache
        options: >-
          --health-cmd "pg_isready -U cutmy -d cutmy_draft_cache"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Install production-family media tools and race compiler
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg python3 git ca-certificates gcc libc6-dev
          ffmpeg -version
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - name: Media contract, copy and HLS timeline regressions on FFmpeg 5.1
        shell: bash
        run: |
          ffmpeg -version | tee ffmpeg-version.txt
          ffprobe -version | tee ffprobe-version.txt
          go test -json -race -count=1 -timeout=5m ./internal/app -run '^(TestDraftCache(WrappedFullTransferAndFlushError|TransferWriterPreservesInterfacesAndCountsErrors|FullTransferGuards|SourceAndFinalServingUnchanged)|TestPreflight(LocalBatch.*|Local.*|Capabilities.*)|TestMediaCrop.*|TestCrop.*|TestWaveform(PCMStreamingBoundsAndSplitSamples|MatchesIndependentAudioTimelineAndOffsets|SelectsActualAudioTrack|PreservesAntiphaseStereoActivity|RetainsAudibleHighFrequencyActivity|SourceRatePreservesClockAndChannelFrameBins)|TestPreviewGeometryIgnoresMalformedMetadataAndEnforcesSize|TestPreviewScalingKeepsExactHeightCapDespiteFloatRounding|TestCopyPreservesFirstKeyframeAndAudioTimeline|TestHLSMiddleExportUsesGlobalTimelineAndRemovesStaging|TestHLSPreservesCombinedIntentionalAudioDelay|TestHLSContinuityPreservesTinyBridgeVideoAndAudioTimeline|TestHLSContinuityRejectsChangedCodecAndCleansFailedGroups|TestMediaContract(RotationDisplayGeometry|SampleAspectNormalization|VariableFrameTimestamps|HDRToneMappingAndCopy|DefaultAudioSelection|AttachedPicturesAreNotVideo|CopyQualityUsesSelectedVideo)|TestHLSMediaContract(RotationAndSAR|DefaultAudio|HDRTags|ContinuityMetadata|FingerprintUsesSelectedTracks)|TestHDR(CapabilityFailureKeepsProcessCause|FailurePreservesCancellationAndLimits)|TestBatchAudioSelectionSubtitlesAndJoinedTimeline|TestJoinedRemoteEntryKeepsMediaFormatAndProtocolRestrictions|TestJoinedAccurateDiscovery.*|TestJoinedMP3UsesFreshBoundedVerificationAndLargeFallback|TestOwnedMP3.*|TestOwnedMP4.*|TestJoinedMP4.*|TestLocalExportSession.*|TestCopyJoinReusesRepeatedSegmentsAndFaststartOnlyFinal|TestCopyKeyframeSelectionKeepsInitialAndDecodeClocks|TestHLSInitializationCacheHasImmutableMapAndBoundedPinnedEntries|TestHLSJobCacheDisabledForSmallStores|TestHLSPacketAnchorHonorsPreparationDecoderBudget|TestPacketDropCapabilitiesCheckToolIdentityBoundsAndCancellation|TestCopyPacketTrimEligibilityPreservesUnprovenClockPaths|TestHLSJobCacheReusesBytesButKeepsIntervalAndNetworkBudgets|TestLocalKeyframeCacheChecksSourceToolStreamAndCancellation|TestLocalKeyframeLookaheadBoundsFallbackAndCacheLimit|TestParallelHLSAdvancesPastStragglerInsideBoundedWindow|TestSourceSubtitleIndexReusesOnlyOneBoundedTrack|TestSubtitleIndexPreservesSpanningUnsortedRepeatedAndEmptyCues|TestCopyJoinAudioPacketCopyPreservesClocks|TestCopyJoinAudioPreservesFineSourcePacketClocks|TestCopyPacketDropPreservesUnknownPresentationTimestamps|TestCopyJoinAudioFallsBackWhenPacketTrimUnavailable)$' | tee bookworm-media-tests.jsonl
          python3 scripts/check-native-results.py --bookworm bookworm-media-tests.jsonl
      - name: Draft attachment ownership, project scope and ZIP on Bookworm
        shell: bash
        env:
          TEST_DATABASE_URL: postgres://cutmy:bookworm-test-only@postgres:5432/cutmy_draft_cache?sslmode=disable
        run: |
          go test -json -race -count=1 -timeout=3m ./internal/app -run '^TestDraftCacheMetadataOwnerLegacyAndScopedDownload$' | tee bookworm-draft-cache-service-tests.jsonl
          python3 scripts/check-native-results.py --draft-cache-service bookworm-draft-cache-service-tests.jsonl
      - name: Retain production-family media evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookworm-media-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            bookworm-media-tests.jsonl
            bookworm-draft-cache-service-tests.jsonl
            ffmpeg-version.txt
            ffprobe-version.txt
          if-no-files-found: warn
          retention-days: 3
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.11-bookworm
        env:
          POSTGRES_USER: cutmy
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: cutmy_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cutmy -d cutmy_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://cutmy:test-only-password@localhost:5432/cutmy_test?sslmode=disable
      CUTMY_TEST_YTDLP: /tmp/cutmy-yt-dlp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg python3 python3-venv
      - name: Install pinned OpenAPI contract tooling in an isolated environment
        run: |
          python3 -m venv /tmp/cutmy-contract-venv
          /tmp/cutmy-contract-venv/bin/python -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements-contract.txt
          echo '/tmp/cutmy-contract-venv/bin' >> "$GITHUB_PATH"
      - name: Install pinned extractor for offline metadata regressions
        run: |
          curl --fail --show-error --location --proto '=https' --tlsv1.2 https://github.com/yt-dlp/yt-dlp/releases/download/2026.08.19/yt-dlp -o /tmp/cutmy-yt-dlp
          echo '1fa6733c37ea6fb51c99ad8fe785e7b7e5f3246c9b980230329d4fb72ed8d4d6  /tmp/cutmy-yt-dlp' | sha256sum --check
          chmod 755 /tmp/cutmy-yt-dlp
      - name: Full checks (media, PostgreSQL, docs, workflows, race and vulnerabilities)
        env:
          CUTMY_TEST_PGTOOLS_CONTAINER: ${{ job.services.postgres.id }}
        run: make check-full
      - name: Required preflight and collection public-handler contract samples
        shell: bash
        run: |
          CUTMY_REQUIRE_CONTRACT=1 go test -json -race -count=1 -timeout=3m ./internal/app -run '^(TestHTTPPreflightPublicContract|TestHTTPCollectionsPublicContract|TestHTTPAgentProjectPublicContract|TestHTTPSubtitleRetimePublicContract)$' | tee preflight-contract-tests.jsonl
          python3 scripts/check-native-results.py --preflight-contract preflight-contract-tests.jsonl
      - name: Retain preflight contract evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: preflight-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: preflight-contract-tests.jsonl
          if-no-files-found: error
      - name: Retained job recovery and uncertain source registration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_DATABASE_URL"
          go test -json -race -count=1 -timeout=3m ./internal/app -run '^(TestUncertainSourceErrorsKeepStatusAndWarnBeforeRetry|TestHTTPJobReplaySurvivesChangedAdmissionLimits|TestHTTPJobReplayKeepsKeyOnlyContractAndOwnerPrivacy|TestHTTPConcurrentFirstSubmissionsKeepOneJob|TestAPIDatabaseErrorPreservesPublicationUncertaintyAndPrivacy|TestAPIDatabaseCallerCancellationWinsDriverFailure|TestAPIDatabaseSuccessfulOperationSurvivesLateCancellation|TestAPIDatabaseHonorsEarlierCallerCancellation|TestAPIDatabaseAdmissionTimeoutReleasesTransactionLocks|TestUploadDefinitePublicationFailuresCleanFilesAndReservation|TestUploadLostAcknowledgementRetainsFilesChargeAndRecovers|TestSourceAndPreviewSlowSyncPreserveDatabaseBudget)$' | tee recovery-contract-tests.jsonl
      - name: CLI help and build information
        run: |
          bin/cutmy --help
          bin/cutmy clip --help
          bin/cutmy inspect --help
          bin/cutmy version
      - name: Required schema 7 to 8 refusal, runtime grants and coordinated restore
        env:
          CUTMY_TEST_PGTOOLS_CONTAINER: ${{ job.services.postgres.id }}
        shell: bash
        run: |
          set -euo pipefail
          previous_source="$RUNNER_TEMP/agent-schema007-source"
          previous_binary="$RUNNER_TEMP/cutmy-schema007"
          mkdir -m 700 "$previous_source"
          git archive e4a0477b727ccfbbf21f86027fdd07f6ffe78419 | tar -x -C "$previous_source"
          go build -C "$previous_source" -trimpath -buildvcs=false -ldflags '-X main.version=v1.3.0 -X main.commit=e4a0477b727ccfbbf21f86027fdd07f6ffe78419' -o "$previous_binary" ./cmd/cutmy
          export CUTMY_TEST_PREVIOUS_SCHEMA007_BINARY="$previous_binary"
          export CUTMY_TEST_PREVIOUS_SCHEMA007_SHA256="$(sha256sum "$previous_binary" | cut -d ' ' -f 1)"
          "$previous_binary" version
          go test -json -race -count=1 -timeout=3m ./internal/app -run '^(TestAgentProjectsPreviousBinaryRefuses008WithoutWrites|TestAgentProjectsRuntimeGrantsPermitCRUDWithoutOwnership|TestAgentProjectsCoordinated008BackupRestorePreservesRowsAndMedia)$' | tee agent-project-recovery-tests.jsonl
          python3 scripts/check-native-results.py --agent-project-recovery agent-project-recovery-tests.jsonl
      - name: Retain schema8 recovery proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-project-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: agent-project-recovery-tests.jsonl
          if-no-files-found: error
          retention-days: 3
      - name: Actual v0.2.1 upgrade, interrupted exports and backup restoration
        env:
          RECOVERY_DATABASE_URL: postgres://cutmy:test-only-password@localhost:5432/cutmy_test?sslmode=disable
          RECOVERY_PG_CONTAINER: ${{ job.services.postgres.id }}
          RECOVERY_WORK_DIR: ${{ runner.temp }}/cutmy-recovery
          RECOVERY_REPORT_PATH: ${{ runner.temp }}/recovery-verification.json
        run: make recovery-check
      - name: Retain redacted upgrade and recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-verification.json
          if-no-files-found: warn
          retention-days: 3
      - name: Retain recovery contract test events
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-contract-tests.jsonl
          if-no-files-found: warn
          retention-days: 3
