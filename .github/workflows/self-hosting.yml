name: Public self-hosting acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      acceptance_mode:
        description: 'Current008 to009 release upgrade and recovery, or an explicit historical mode'
        type: choice
        options: [external-audio-008-to-009, agent-projects-007-to-008, metadata-resolution-006-to-007, source-media-cleanup-005-to-006, current-installation, same-schema, source-retention-004-to-005]
        default: external-audio-008-to-009
        required: true

permissions:
  contents: read

concurrency:
  group: public-self-hosting-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  public-profile:
    name: Disposable Linux public profile, upgrade and restoration
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance_mode == 'source-retention-004-to-005'
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install acceptance tools on this disposable hosted runner
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends caddy ffmpeg python3-venv iptables iproute2 util-linux openssl
          # The separately started local test Caddy owns loopback 443. Stop the
          # service installed above only on this disposable GitHub runner.
          sudo systemctl disable --now caddy
          docker compose version
          python3 -m venv "$RUNNER_TEMP/cutmy-public-venv"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -m pip install --disable-pip-version-check --no-cache-dir -r scripts/requirements-contract.txt
      - name: Pure lifecycle and acceptance controls
        run: |
          set -o pipefail
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s deploy -p self_host_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-profile-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p self_hosting_acceptance_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-acceptance-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p source_retention_transition_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-transition-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p current_installation_acceptance_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-current-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p source_media_cleanup_transition_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-cleanup-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p metadata_resolution_transition_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-metadata-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p agent_projects_transition_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-projects-controls.log"
          "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B -m unittest discover -s scripts -p external_audio_transition_test.py -v 2>&1 | tee "$RUNNER_TEMP/public-audio-controls.log"
      - name: Explicit bridge-filter prerequisites on the disposable runner
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          test "$(cat /proc/sys/net/bridge/bridge-nf-call-iptables)" = 1
          # Do not repair Docker dispatch, flush global rules or restart Docker.
          sudo install -d -m 0700 "$RUNNER_TEMP/cutmy-public-private" "$RUNNER_TEMP/cutmy-public-home" "$RUNNER_TEMP/cutmy-public-docker"
      - name: Actual public profile HTTPS, roles, egress, image upgrade and restore
        env:
          ACCEPTANCE_PR_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          ACCEPTANCE_MODE: ${{ github.event_name != 'workflow_dispatch' && 'external-audio-008-to-009' || inputs.acceptance_mode }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sudo env \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" \
            HOME="$RUNNER_TEMP/cutmy-public-home" DOCKER_CONFIG="$RUNNER_TEMP/cutmy-public-docker" \
            TMPDIR="$RUNNER_TEMP/cutmy-public-private" PATH="$PATH" \
            "$RUNNER_TEMP/cutmy-public-venv/bin/python" -B scripts/self-hosting-acceptance.py \
            --allow-disposable-host --revision "$GITHUB_SHA" --pr-head "$ACCEPTANCE_PR_HEAD" \
            --mode "$ACCEPTANCE_MODE" \
            --temp-directory "$RUNNER_TEMP/cutmy-public-private" \
            --output "$RUNNER_TEMP/public-self-hosting-evidence"
      - name: Require the exact mode groups, raw transition evidence and independent cleanup
        env:
          ACCEPTANCE_MODE: ${{ github.event_name != 'workflow_dispatch' && 'external-audio-008-to-009' || inputs.acceptance_mode }}
        run: |
          python3 -B scripts/self-hosting-acceptance.py --mode "$ACCEPTANCE_MODE" --verify-report "$RUNNER_TEMP/public-self-hosting-evidence/acceptance-report.json"
      - name: Retain sanitized public profile evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          name: public-self-hosting-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/public-self-hosting-evidence
            ${{ runner.temp }}/public-profile-controls.log
            ${{ runner.temp }}/public-acceptance-controls.log
            ${{ runner.temp }}/public-transition-controls.log
            ${{ runner.temp }}/public-current-controls.log
            ${{ runner.temp }}/public-cleanup-controls.log
            ${{ runner.temp }}/public-metadata-controls.log
            ${{ runner.temp }}/public-projects-controls.log
            ${{ runner.temp }}/public-audio-controls.log
          if-no-files-found: warn
          retention-days: 3
