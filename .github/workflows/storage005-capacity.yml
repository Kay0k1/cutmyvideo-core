name: Storage normal operational capacity

on:
  workflow_dispatch:
    inputs:
      maximum_size:
        description: Largest reviewed size (1000 runs only the first pair)
        type: choice
        default: '1000'
        options: ['1000', '10000']
  pull_request:
    paths:
      - benchmarks/storage-normal-capacity/**
      - .github/workflows/storage005-capacity.yml

permissions:
  contents: read

concurrency:
  group: storage-normal-capacity-pilot
  cancel-in-progress: false

jobs:
  pure-protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Pure fixtures (all actual children and network calls denied)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s benchmarks/storage-normal-capacity -p protocol_test.py -v
  fixed-postgres-pilot:
    if: github.event_name == 'workflow_dispatch'
    needs: pure-protocol
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 128MiB
      GOTOOLCHAIN: local
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Exact schema004 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 63873e935626d51087d0a26b84f1de9a7ed86a28
          path: .comparison/before
          fetch-depth: 2
          persist-credentials: false
      - name: Exact current schema005 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: d594cc4681dc1cab61664cec8c92bdf9a3e9444c
          path: .comparison/after
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.2'
          cache: false
      - name: New normal profile (legacy5ms results remain separate)
        env:
          GOCACHE: ${{ runner.temp }}/storage-normal-go-cache
          CUTMY_STORAGE_NORMAL_MAXIMUM_SIZE: ${{ inputs.maximum_size }}
        run: python3 benchmarks/storage-normal-capacity/run_hosted.py
      - name: Preserve original measurements and refusals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: storage-normal-pilot-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/storage-normal-pilot/
          if-no-files-found: warn
          retention-days: 30
