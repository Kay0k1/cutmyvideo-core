[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "cutmyvideo"
version = "1.6.0"
description = "Typed local and HTTP clients for cutmyvideo-core"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "cutmyvideo contributors"}]
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed", "License :: OSI Approved :: MIT License"]

[project.urls]
Repository = "https://github.com/Kay0k1/cutmyvideo-core"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cutmyvideo = ["py.typed"]
